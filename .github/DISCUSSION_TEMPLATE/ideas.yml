title: "[Proposed hypothesis] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Propose a falsifiable explanation for an approved SAIF result or offer an alternative to an existing hypothesis.

        **This discussion is public. Do not include PHI, patient or specimen identifiers, restricted data, credentials, private paths, or unpublished sensitive results.**
  - type: input
    id: result
    attributes:
      label: Result or organ–demographic association to explain
      description: Include the organ, demographic variable, and claim ID when responding to an existing hypothesis.
      placeholder: Lymph node × sex; optional claim M3
    validations:
      required: true
  - type: input
    id: result_url
    attributes:
      label: Hub or Results Atlas URL
    validations:
      required: true
  - type: textarea
    id: mechanism
    attributes:
      label: Proposed mechanism
      description: State one explanation clearly. Separate tissue biology from disease, care pathway, sampling, and technical context.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Evidence or rationale
      description: Explain why the mechanism is plausible and distinguish literature evidence from SAIF evidence.
    validations:
      required: true
  - type: textarea
    id: prediction
    attributes:
      label: What should we observe if this hypothesis is true?
      description: State a falsifiable tissue, subgroup, attention, or control-pattern prediction. Say "not yet specified" if incomplete.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Optional validation experiment
      description: Suggest a cohort, matching strategy, ablation, pathologist review, or replication test.
  - type: input
    id: reference
    attributes:
      label: Optional reference
      description: Provide a DOI, PMID, or stable URL. Do not paste full copyrighted articles.
  - type: checkboxes
    id: safety
    attributes:
      label: Public-data confirmation
      options:
        - label: I confirm that this submission contains no sensitive, restricted, identifying, or credential material.
          required: true
