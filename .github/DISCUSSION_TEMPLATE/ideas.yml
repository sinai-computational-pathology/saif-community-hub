title: "[Hypothesis critique] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Challenge, refine, or offer an alternative explanation for a public claim.

        **This discussion is public. Do not include PHI, patient or specimen identifiers, restricted data, credentials, private paths, or unpublished sensitive results.**
  - type: input
    id: context
    attributes:
      label: Organ–demographic combination and claim ID
      placeholder: skin × race/self-reported ancestry, M3
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Hub or Results Atlas URL
    validations:
      required: true
  - type: textarea
    id: interpretation
    attributes:
      label: Interpretation or critique
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: Alternative explanation
      description: Describe confounding, case mix, workflow, morphology, or another mechanism.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Provide DOI, PMID, stable URL, or a concise description. Do not paste full copyrighted articles.
  - type: checkboxes
    id: safety
    attributes:
      label: Public-data confirmation
      options:
        - label: I confirm that this submission contains no sensitive, restricted, identifying, or credential material.
          required: true
