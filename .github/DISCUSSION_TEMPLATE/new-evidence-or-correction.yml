title: "[Evidence] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Suggest a source, correct a citation, or narrow a statement. Exact claim support matters more than topic similarity.

        **This discussion is public. Do not include PHI, identifiers, restricted data, credentials, private paths, or unpublished sensitive results.**
  - type: input
    id: context
    attributes:
      label: Organ–demographic combination and claim ID
      placeholder: organ × demographic, claim ID
    validations:
      required: true
  - type: input
    id: identifier
    attributes:
      label: DOI, PMID, or stable source URL
    validations:
      required: true
  - type: textarea
    id: support
    attributes:
      label: Exact support
      description: Paraphrase the finding and name the section, figure, or table that supports it.
    validations:
      required: true
  - type: dropdown
    id: change
    attributes:
      label: Proposed change
      options:
        - Add supporting evidence
        - Narrow or qualify the claim
        - Correct source metadata
        - Challenge or retire the claim
        - Add a conflicting source
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public-data confirmation
      options:
        - label: I confirm that this submission contains no sensitive, restricted, identifying, credential, or unlawfully shared full-text material.
          required: true
