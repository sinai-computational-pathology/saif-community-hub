        pmcid: PMC12347225
        evidence_status: source metadata incomplete
    evidence_status: source metadata incomplete
  - id: M2
    section: histomorphology
    status: active
    hypothesis: Direct intrinsic race morphology is unsupported.
    mechanism: 'Persistent signal is more likely unmeasured context: site, stage, screening, exposure, microbiome, or institution.'
    features: Background mucosa, inflammation, tumor microenvironment.
    confounders: Institution, geography, stain/scanner, comorbidities.
    validation: Treat residual signal as context until matched clinical/molecular audit is complete.
    literature: []
    evidence_status: source metadata incomplete
  - id: M3
    section: histomorphology
    status: active
    hypothesis: Serrated and right-sided precursor morphology may carry context signal.
    mechanism: >-
      Serrated lesions and right-sided tumors have distinctive architecture and may differ by screening and molecular
      pathway.
    features: Sessile serrated lesion architecture, crypt dilation, mucin cap, right-sided location.
    confounders: Site, polyp type, MSI/MMR, age, screening.
    validation: Match polyp subtype and location before interpreting race signal.
    literature:
