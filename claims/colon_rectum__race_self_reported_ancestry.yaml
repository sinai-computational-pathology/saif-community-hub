key_takeaways:
  - 'Best review target: right/left location, mucinous morphology, serrated lesions, MSI-like lymphocytes.'
  - 'Main shortcut risk: stage, screening, subsite, and institution/access context.'
  - This is a disease-distribution/context queue item, not a direct biology claim.
