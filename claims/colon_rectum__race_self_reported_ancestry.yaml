        evidence_status: source metadata incomplete
    evidence_status: source metadata incomplete
  - id: M4
    section: histomorphology
    status: active
    hypothesis: Tumor microenvironment features may be secondary to subtype, site, and stage.
    mechanism: Immune infiltrates and stromal reaction vary with MSI, tumor side, and treatment context.
    features: TILs, lymphoid aggregates, desmoplasia, necrosis, mucin.
    confounders: MSI/MMR, stage, site, treatment, grade.
    validation: Review only after site/stage/molecular matching; require added references for direct race/TME claims.
