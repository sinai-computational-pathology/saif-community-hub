combo: colon_rectum__race_self_reported_ancestry
organ_slug: colon_rectum
organ: Colon/Rectum
demographic: race_self_reported_ancestry
demographic_label: Race / Self-Reported Ancestry
summary: >-
  Colon/rectum race/self-reported ancestry appears in the top 15 because of high specimen availability and residual
  signal, but it is a context-sensitive candidate. The likely carriers are early-onset CRC, sidedness, screening/access,
  stage, molecular pathway, mucinous/serrated/MSI-like morphology, microbiome/exposure context, and
  institution/workflow. Direct intrinsic race-specific colorectal H&E morphology is not established.
claims:
  - id: C1
    section: clinical_context
    status: active
    hypothesis: CRC incidence, early-onset CRC, stage, and screening access differ across racial groups.
    mechanism: Race/self-report may proxy structural determinants, screening, geography, and stage at presentation.
    features: Cancer vs benign, stage surrogates, resection vs biopsy, obstruction/perforation context.
    confounders: Diagnosis, stage, procedure, institution, screening history, age.
    validation: Match diagnosis/stage/procedure and audit institution/site distribution.
    literature:
      - short_citation: Abancens et al., 2020
        citation: >-
          Abancens M, Bustos V, Harvey H, McBryan J, Harvey BJ. Sexual Dimorphism in Colon Cancer. Frontiers in
          Oncology. 2020
        evidence_status: source metadata incomplete
      - short_citation: Tsokkou et al., 2025
        citation: >-
          Tsokkou S, et al. Sex Differences in Colorectal Cancer: Epidemiology, Risk, Screening, and Molecular
          Mechanisms. 2025
        pmcid: PMC12347225
        evidence_status: source metadata incomplete
    evidence_status: source metadata incomplete
  - id: C2
    section: clinical_context
    status: active
    hypothesis: Tumor sidedness and molecular-pathway distributions may differ by group.
    mechanism: Right/left location, MSI, serrated pathway, and molecular subtype alter H&E morphology.
    features: Right vs left site, serrated lesions, mucinous features, TILs, lymphoid aggregates.
    confounders: Anatomic subsite, MSI/MMR, serrated pathway, age.
    validation: Match anatomic subsite and available molecular/pathology markers.
    literature:
      - short_citation: Abancens et al., 2020
        citation: >-
          Abancens M, Bustos V, Harvey H, McBryan J, Harvey BJ. Sexual Dimorphism in Colon Cancer. Frontiers in
          Oncology. 2020
        evidence_status: source metadata incomplete
      - short_citation: Tsokkou et al., 2025
        citation: >-
          Tsokkou S, et al. Sex Differences in Colorectal Cancer: Epidemiology, Risk, Screening, and Molecular
          Mechanisms. 2025
        pmcid: PMC12347225
        evidence_status: source metadata incomplete
    evidence_status: source metadata incomplete
  - id: C3
    section: clinical_context
    status: active
    hypothesis: Screening colonoscopy and biopsy indication can create race-associated workflow signal.
    mechanism: Screening access and surveillance intervals alter proportions of normal biopsies, polyps, cancer, and resections.
    features: Normal mucosa, adenoma, serrated polyp, invasive cancer, biopsy vs colectomy.
    confounders: Screening status, procedure type, site, institution, age.
    validation: Compare within procedure/diagnosis groups and inspect normal-biopsy fraction.
    literature:
      - short_citation: Tsokkou et al., 2025
        citation: >-
          Tsokkou S, et al. Sex Differences in Colorectal Cancer: Epidemiology, Risk, Screening, and Molecular
          Mechanisms. 2025
        pmcid: PMC12347225
        evidence_status: source metadata incomplete
    evidence_status: source metadata incomplete
  - id: C4
    section: clinical_context
    status: active
    hypothesis: Inflammation and IBD-related colorectal specimens may be unevenly represented.
    mechanism: >-
      Structural determinants and disease phenotype can alter chronic colitis, dysplasia surveillance, and resection
      mix.
    features: Chronic active colitis, architectural distortion, dysplasia, colectomy specimens.
    confounders: IBD diagnosis, medication, site, procedure, duration.
    validation: Exclude IBD or analyze IBD-only cases separately.
    literature:
      - short_citation: Tsokkou et al., 2025
        citation: >-
          Tsokkou S, et al. Sex Differences in Colorectal Cancer: Epidemiology, Risk, Screening, and Molecular
          Mechanisms. 2025
        pmcid: PMC12347225
        evidence_status: source metadata incomplete
    evidence_status: source metadata incomplete
  - id: M1
    section: histomorphology
    status: active
    hypothesis: Residual signal may be mediated by mucinous, MSI-like, or serrated-pathway morphology.
    mechanism: Molecular pathway and anatomic-location differences create visible tumor and precursor patterns.
    features: Mucin, tumor-infiltrating lymphocytes, Crohn-like lymphoid reaction, serrated architecture.
    confounders: Tumor site, MSI/MMR, grade, stage, age.
    validation: Compare residual race signal after site, grade, and MSI/MMR matching where available.
    literature:
      - short_citation: Abancens et al., 2020
        citation: >-
          Abancens M, Bustos V, Harvey H, McBryan J, Harvey BJ. Sexual Dimorphism in Colon Cancer. Frontiers in
          Oncology. 2020
        evidence_status: source metadata incomplete
