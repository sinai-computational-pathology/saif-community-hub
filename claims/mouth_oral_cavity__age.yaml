          2026
        doi: 10.1016/j.identj.2026.109482
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13068552/
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: M3
    section: histomorphology
    status: active
    hypothesis: Lamina propria collagen and extracellular matrix remodel with age.
    mechanism: Aging fibroblasts and ECM turnover may alter collagen density, organization, and stromal stiffness.
    features: Collagen density, hyalinization, stromal cellularity, fibrosis, elastotic-like change.
    confounders: Scar, chronic inflammation, tumor desmoplasia, subsite.
    validation: Restrict to benign background lamina propria; quantify stromal texture/collagen density.
    literature:
      - short_citation: Gomi et al., 2020
        citation: >-
          Gomi T, Imamura T, et al. Comprehensive histological investigation of age-related changes in dermal
          extracellular matrix and muscle fibers in the upper lip vermilion. International Journal of Cosmetic Science.
          2020
        doi: 10.1111/ics.12622
