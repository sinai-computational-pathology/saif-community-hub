    evidence_status: needs claim-level validation
  - id: M2
    section: histomorphology
    status: active
    hypothesis: Rete ridge architecture becomes flatter or less complex with age.
    mechanism: Aging may reduce epithelial-connective tissue interface complexity.
    features: Rete ridge height/density, epithelial-connective interface, papillary architecture.
    confounders: Subsite, frictional keratosis, dysplasia, section orientation.
    validation: Morphometric rete ridge analysis in benign mucosa after subsite matching.
    literature:
      - short_citation: Shklar, 1966
        citation: Shklar G. The effects of aging upon oral mucosa. Journal of Investigative Dermatology. 1966
        pmid: '5916125'
        doi: 10.1038/jid.1966.107
