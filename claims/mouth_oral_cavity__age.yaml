combo: mouth_oral_cavity__age
organ_slug: mouth_oral_cavity
organ: Mouth / Oral Cavity
demographic: age
demographic_label: Age Group
summary: >-
  Age signal in oral cavity histology is likely mixed. Clinical-context signal may come from age-skewed enrichment for
  oral squamous cell carcinoma, dysplasia, chronic mucosal injury, denture/prosthetic trauma, salivary dysfunction, and
  procedure differences. Morphology signal may also persist in benign/background tissue through epithelial atrophy, rete
  ridge flattening, stromal collagen remodeling, vascular change, chronic inflammation, and minor salivary gland
  atrophy.
claims:
  - id: C1
    section: clinical_context
    status: active
    hypothesis: Older patients are enriched for oral squamous cell carcinoma.
    mechanism: >-
      Oral cancer incidence and cancer-directed resections increase with age, creating diagnosis and specimen-type
      shortcuts.
    features: SCC vs benign mucosa, invasive carcinoma, keratinization, necrosis, perineural invasion, resection vs biopsy.
    confounders: Diagnosis, tumor stage, oral subsite, specimen type, treatment status.
    validation: >-
      Match benign/malignant status and SCC stage/subsite; test residual age signal within SCC-only and benign-only
      subsets.
    literature:
      - short_citation: Lenoci et al., 2024
        citation: >-
          Lenoci D, Moresco E, Cavalieri S, et al. Oral cancer in young adults: incidence, risk factors, prognosis, and
          molecular biomarkers. Frontiers in Oncology. 2024
        doi: 10.3389/fonc.2024.1452909
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11484398/
        evidence_status: needs claim-level validation
      - short_citation: Majchrzak et al., 2014
        citation: >-
          Majchrzak E, Szybiak B, Wegner A, et al. Oral cavity and oropharyngeal squamous cell carcinoma in young
          adults: a review of the literature. 2014
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3908841/
        evidence_status: source metadata incomplete
      - short_citation: Brizuela & Winters, 2023
        citation: Brizuela M, Winters R. Histology, Oral Mucosa. StatPearls. Updated 2023
        pmid: '34033326'
        url: https://www.ncbi.nlm.nih.gov/books/NBK572115/
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C2
    section: clinical_context
    status: active
    hypothesis: Older patients are enriched for epithelial dysplasia and field-change biopsies.
    mechanism: >-
      Cumulative tobacco/alcohol, dental irritation, and chronic mucosal injury can increase dysplasia workups in older
      patients.
    features: Dysplasia grade, keratinizing atypia, hyperkeratosis, lichenoid/interface inflammation, margin status.
    confounders: Dysplasia grade, risk exposure, subsite, biopsy indication.
    validation: Match dysplasia grade and oral subsite; compare age prediction within dysplasia-only cases.
    literature:
      - short_citation: Porto et al., 2024
        citation: >-
          Porto UN, Laureano NK, dos Santos NS, et al. Leukoplakia and erythroplakia in youngers versus older
          individuals: a clinicopathological retrospective study. 2024
        doi: 10.4317/medoral.26659
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11365051/
        evidence_status: needs claim-level validation
