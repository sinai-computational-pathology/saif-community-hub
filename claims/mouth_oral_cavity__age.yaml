    evidence_status: needs claim-level validation
  - id: C4
    section: clinical_context
    status: active
    hypothesis: Older patients may be enriched for salivary dysfunction-related pathology.
    mechanism: >-
      Aging and medications can alter oral moisture and minor salivary gland context, affecting sampling and
      inflammation.
    features: Minor salivary gland tissue, acinar atrophy, duct dilation, chronic sialadenitis, fibrosis, fatty replacement.
    confounders: Salivary gland inclusion, Sjogren/autoimmune disease, medication history, biopsy site.
    validation: Stratify by presence of minor salivary gland tissue and salivary diagnoses.
    literature:
      - short_citation: Qiu et al., 2026
        citation: >-
          Qiu C, Jie W, et al. Ageing of the Oral Mucosa: Mechanisms and Consequences. International Dental Journal.
          2026
        doi: 10.1016/j.identj.2026.109482
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13068552/
        evidence_status: needs claim-level validation
      - short_citation: Brizuela & Winters, 2023
        citation: Brizuela M, Winters R. Histology, Oral Mucosa. StatPearls. Updated 2023
        pmid: '34033326'
        url: https://www.ncbi.nlm.nih.gov/books/NBK572115/
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: M1
    section: histomorphology
    status: active
    hypothesis: Oral epithelial thickness decreases with age.
    mechanism: Oral mucosal aging may cause epithelial thinning/atrophy and reduced proliferative capacity.
    features: Epithelial thickness, atrophy, basal/parabasal cellularity, keratin layer.
    confounders: Subsite, inflammation, dysplasia, ulceration, fixation/orientation.
    validation: Quantify epithelial thickness in benign non-ulcerated mucosa matched by subsite.
    literature:
      - short_citation: Shklar, 1966
        citation: Shklar G. The effects of aging upon oral mucosa. Journal of Investigative Dermatology. 1966
        pmid: '5916125'
        doi: 10.1038/jid.1966.107
        url: https://pubmed.ncbi.nlm.nih.gov/5916125/
