          2026
        doi: 10.1016/j.identj.2026.109482
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13068552/
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: M4
    section: histomorphology
    status: active
    hypothesis: Oral mucosal immune background changes with age.
    mechanism: Immunosenescence/inflammaging may alter chronic inflammatory infiltrates.
    features: Lymphoplasmacytic infiltrate, lichenoid/interface inflammation, lymphoid aggregates.
    confounders: Diagnosis, infection, autoimmune disease, ulceration, treatment.
    validation: Test within benign/reactive diagnoses and adjust for inflammation-related diagnostic labels.
    literature:
      - short_citation: Qiu et al., 2026
        citation: >-
          Qiu C, Jie W, et al. Ageing of the Oral Mucosa: Mechanisms and Consequences. International Dental Journal.
          2026
