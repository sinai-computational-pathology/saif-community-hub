        citation: >-
          Alnuaimi AD, Wiesenfeld D, O'Brien-Simpson NM, Reynolds EC, McCullough MJ. Long-term follow-up of oral
          epithelial dysplasia: A hospital based cross-sectional study. 2020
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7770253/
        evidence_status: source metadata incomplete
      - short_citation: Wetzel & Wollenberg, 2020
        citation: Wetzel SL, Wollenberg J. Oral Potentially Malignant Disorders. Dental Clinics of North America. 2020
        pmid: '31735231'
        doi: 10.1016/j.cden.2019.08.004
        url: https://pubmed.ncbi.nlm.nih.gov/31735231/
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C3
    section: clinical_context
    status: active
    hypothesis: Older patients may have more prosthetic/dental trauma and chronic ulcer/injury specimens.
    mechanism: Dentures, dental disease, medications, and comorbidity can shift biopsy mix toward chronic reactive lesions.
    features: Ulceration, granulation tissue, fibrosis/scar, pseudoepitheliomatous hyperplasia, chronic inflammation.
    confounders: Diagnosis, denture/prosthetic history, subsite, biopsy indication.
    validation: >-
      Use report diagnosis and subsite to identify traumatic/reactive lesions; test whether age signal attenuates when
      excluded.
    literature:
      - short_citation: Fitzpatrick et al., 2019
        citation: >-
          Fitzpatrick SG, Cohen DM, Clark AN. Ulcerated Lesions of the Oral Mucosa: Clinical and Histologic Review. Head
          and Neck Pathology. 2019
