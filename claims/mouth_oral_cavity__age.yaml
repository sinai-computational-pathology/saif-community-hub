key_takeaways:
  - >-
    The most likely clinical-context signal is age-skewed diagnosis and specimen mix, especially SCC, dysplasia, chronic
    injury, and salivary dysfunction.
  - >-
    The most plausible morphology signal is benign mucosal aging: epithelial atrophy, flatter rete ridges, stromal
    collagen remodeling, and minor salivary gland atrophy.
  - >-
    The most important validation is diagnosis-, subsite-, and specimen-type matching, followed by benign/background
    mucosa analysis.
