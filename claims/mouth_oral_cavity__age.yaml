        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13068552/
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: M5
    section: histomorphology
    status: active
    hypothesis: Minor salivary gland atrophy may encode age when glands are present.
    mechanism: Aging and xerostomia-related processes may reduce acini and increase fibrosis/fat.
    features: Acinar atrophy, duct dilation, periductal fibrosis, fatty replacement, chronic sialadenitis.
    confounders: Salivary gland sampling, Sjogren disease, radiation, medication history.
    validation: Analyze only slides containing minor salivary gland tissue; match salivary diagnosis.
    literature:
      - short_citation: Qiu et al., 2026
        citation: >-
