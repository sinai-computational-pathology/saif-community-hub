combo: thyroid__age
organ_slug: thyroid
organ: Thyroid
demographic: age
demographic_label: Age Group
summary: >-
  Age signal in thyroid histology is likely strong and mixed. Clinical-context signal can arise from age-associated
  nodules, multinodular goiter, thyroiditis, incidental microcarcinoma, cancer workup, and procedure type. Direct
  morphology signal is plausible because aging thyroid follicles show size heterogeneity, irregular architecture,
  colloid/Tg changes, oncocytic change, empty/dilated follicles, lipofuscin, and fibrosis.
claims:
  - id: C1
    section: clinical_context
    status: active
    hypothesis: Older patients are enriched for nodular thyroid disease.
    mechanism: Thyroid nodules and multinodular goiter increase with age and can dominate surgical specimens.
    features: Nodular architecture, variable follicles, colloid nodules, fibrosis, thyroidectomy specimens.
    confounders: Nodule status, goiter diagnosis, procedure type, institution.
    validation: Match nodule/goiter status; test age prediction in non-nodular background tissue.
    literature:
      - short_citation: Lee et al., 2016
        citation: >-
          Lee J, Yi S, Kang YE, et al. Morphological and Functional Changes in the Thyroid Follicles of the Aged Murine
          and Humans. Journal of Pathology and Translational Medicine. 2016
        pmid: '27737529'
        pmcid: PMC5122729
        doi: 10.4132/jptm.2016.07.19
        url: https://pubmed.ncbi.nlm.nih.gov/27737529/
        evidence_status: needs claim-level validation
      - short_citation: Faggiano et al., 2004
        citation: >-
          Faggiano A, Coulot J, Bellon N, et al. Age-dependent variation of follicular size and expression of iodine
          transporters in human thyroid tissue. Journal of Nuclear Medicine. 2004
        pmid: '14960641'
        url: https://pubmed.ncbi.nlm.nih.gov/14960641/
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C2
    section: clinical_context
    status: active
    hypothesis: Older patients may be enriched for thyroid cancer workup.
    mechanism: Cancer detection and incidental carcinoma can alter diagnosis and specimen mix.
    features: Papillary carcinoma nuclear features, tumor foci, capsular/vascular invasion, tumor size/stage.
    confounders: Benign/malignant status, histologic subtype, tumor size/stage, procedure.
    validation: Match benign/malignant status and subtype/stage; test residual signal.
    literature:
      - short_citation: Meza & Chang, 2015
        citation: >-
          Meza R, Chang JT. Multistage carcinogenesis and the incidence of thyroid cancer in the US by sex, race, stage
          and histology. BMC Public Health. 2015
        doi: 10.1186/s12889-015-2108-4
        url: https://bmcpublichealth.biomedcentral.com/articles/10.1186/s12889-015-2108-4
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C3
    section: clinical_context
    status: active
    hypothesis: Thyroiditis and endocrine workup may vary with age.
    mechanism: Autoimmune/chronic thyroiditis and endocrine evaluation can alter tissue mix.
    features: Lymphocytic thyroiditis, germinal centers, Hurthle cells, fibrosis.
    confounders: Thyroiditis status, autoimmune disease, sex, diagnosis.
    validation: Stratify by thyroiditis diagnosis and inflammation burden.
    literature:
      - short_citation: Akamizu & Amino, 2017
        citation: Akamizu T, Amino N. Hashimoto's Thyroiditis. Endotext. Updated 2017
        url: https://www.ncbi.nlm.nih.gov/books/NBK285557/
        evidence_status: source metadata incomplete
    evidence_status: source metadata incomplete
  - id: C4
    section: clinical_context
    status: active
    hypothesis: Procedure type may encode age.
    mechanism: Lobectomy/thyroidectomy for nodules/cancer versus other samples changes tissue context.
    features: Whole thyroid architecture, capsule, tumor margins, biopsy/surgical specimen type.
    confounders: Procedure type, diagnosis, institution, year.
    validation: Train/evaluate within procedure-type strata.
    literature:
      - short_citation: Meza & Chang, 2015
        citation: >-
          Meza R, Chang JT. Multistage carcinogenesis and the incidence of thyroid cancer in the US by sex, race, stage
          and histology. BMC Public Health. 2015
        doi: 10.1186/s12889-015-2108-4
        url: https://bmcpublichealth.biomedcentral.com/articles/10.1186/s12889-015-2108-4
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: M1
    section: histomorphology
    status: active
    hypothesis: Follicle size heterogeneity increases with age.
    mechanism: Aging thyroid shows variable follicular size and altered follicular organization.
    features: Follicle diameter variability, macro/microfollicles, irregular follicle shape.
    confounders: Nodules, goiter, fixation, subsite within gland.
    validation: Quantify follicle size distribution in benign non-nodular background.
    literature:
      - short_citation: Lee et al., 2016
        citation: >-
          Lee J, Yi S, Kang YE, et al. Morphological and Functional Changes in the Thyroid Follicles of the Aged Murine
          and Humans. Journal of Pathology and Translational Medicine. 2016
        pmid: '27737529'
        pmcid: PMC5122729
        doi: 10.4132/jptm.2016.07.19
        url: https://pubmed.ncbi.nlm.nih.gov/27737529/
        evidence_status: needs claim-level validation
      - short_citation: Faggiano et al., 2004
        citation: >-
          Faggiano A, Coulot J, Bellon N, et al. Age-dependent variation of follicular size and expression of iodine
          transporters in human thyroid tissue. Journal of Nuclear Medicine. 2004
        pmid: '14960641'
        url: https://pubmed.ncbi.nlm.nih.gov/14960641/
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: M2
    section: histomorphology
    status: active
    hypothesis: Colloid/Tg appearance changes with age.
    mechanism: Aging follicles may show large/fragmented Tg globules and empty or dilated follicles.
    features: Colloid density, vacuolation, scalloping, empty follicles, Tg globules.
    confounders: Graves disease, fixation, nodular disease, thyroid function.
    validation: Compare colloid texture in diagnosis-matched benign follicles.
    literature:
      - short_citation: Lee et al., 2016
        citation: >-
          Lee J, Yi S, Kang YE, et al. Morphological and Functional Changes in the Thyroid Follicles of the Aged Murine
          and Humans. Journal of Pathology and Translational Medicine. 2016
        pmid: '27737529'
        pmcid: PMC5122729
        doi: 10.4132/jptm.2016.07.19
        url: https://pubmed.ncbi.nlm.nih.gov/27737529/
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: M3
    section: histomorphology
    status: active
    hypothesis: Oncocytic/Hurthle-like follicular change may increase with age/context.
    mechanism: Mitochondrial and chronic injury changes can produce eosinophilic oncocytic cells.
    features: Hurthle cells, eosinophilic granular cytoplasm, follicular epithelial height.
    confounders: Thyroiditis, nodules, neoplasia, fixation.
    validation: Match thyroiditis/nodule status; quantify oncocytic cell prevalence.
    literature:
      - short_citation: Lee et al., 2016
        citation: >-
          Lee J, Yi S, Kang YE, et al. Morphological and Functional Changes in the Thyroid Follicles of the Aged Murine
          and Humans. Journal of Pathology and Translational Medicine. 2016
        pmid: '27737529'
        pmcid: PMC5122729
        doi: 10.4132/jptm.2016.07.19
        url: https://pubmed.ncbi.nlm.nih.gov/27737529/
        evidence_status: needs claim-level validation
      - short_citation: Akamizu & Amino, 2017
        citation: Akamizu T, Amino N. Hashimoto's Thyroiditis. Endotext. Updated 2017
        url: https://www.ncbi.nlm.nih.gov/books/NBK285557/
        evidence_status: source metadata incomplete
    evidence_status: needs claim-level validation
  - id: M4
    section: histomorphology
    status: active
    hypothesis: Lipofuscin/pigment-like aging changes may encode age.
    mechanism: Accumulation of intracellular aging pigment has been described in thyroid follicular cells.
    features: Fine brown cytoplasmic pigment, follicular epithelial cells, autofluorescent/lipofuscin-like material if visible.
    confounders: Hemosiderin, artifact, species/source differences, stain quality.
    validation: Pathologist review of pigment candidates; validate with special stains only if feasible.
    literature:
      - short_citation: Ives et al., 1975
        citation: >-
          Ives PJ, Haensly WE, Maxwell PA, McArthur NH. A histochemical and ultrastructural study of lipofuscin
          accumulation in thyroid follicular cells of aging domestic cats. Mechanisms of Ageing and Development. 1975
        pmid: '1228338'
        doi: 10.1016/0047-6374(75)90041-X
        url: https://pubmed.ncbi.nlm.nih.gov/1228338/
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: M5
    section: histomorphology
    status: active
    hypothesis: Stromal fibrosis and gland architectural remodeling may encode age.
    mechanism: Aging, nodules, and chronic injury can increase fibrosis and architectural heterogeneity.
    features: Fibrous septa, stromal fibrosis, capsular fibrosis, nodular remodeling.
    confounders: Nodular goiter, thyroiditis, tumor desmoplasia, prior procedure.
    validation: Quantify fibrosis after excluding tumors and matching nodular/thyroiditis status.
    literature:
      - short_citation: Lee et al., 2016
        citation: >-
          Lee J, Yi S, Kang YE, et al. Morphological and Functional Changes in the Thyroid Follicles of the Aged Murine
          and Humans. Journal of Pathology and Translational Medicine. 2016
        pmid: '27737529'
        pmcid: PMC5122729
        doi: 10.4132/jptm.2016.07.19
        url: https://pubmed.ncbi.nlm.nih.gov/27737529/
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
key_takeaways:
  - >-
    The strongest clinical-context hypotheses are nodular disease, cancer workup, thyroiditis/endocrine context, and
    procedure type.
  - >-
    The strongest morphology hypotheses are follicle size heterogeneity, colloid/Tg changes, oncocytic change,
    lipofuscin/pigment, and fibrosis.
  - >-
    The most important validation is matching by diagnosis, nodule status, thyroiditis, malignancy/subtype/stage, and
    procedure type.
