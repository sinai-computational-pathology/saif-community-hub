combo: sinus_sinonasal_tract__age
organ_slug: sinus_sinonasal_tract
organ: Sinus / Sinonasal Tract
demographic: age
demographic_label: Age Group
summary: >-
  Age signal in sinonasal specimens is likely mixed but diagnosis-dependent. Clinical-context signal may come from
  age-associated distributions of CRS/nasal polyps, allergic/fungal disease, Schneiderian papilloma, and sinonasal
  malignancy. Morphology signal is more likely chronic inflammatory remodeling than generic normal-aging histology.
claims:
  - id: C1
    section: clinical_context
    status: active
    hypothesis: Age signal may reflect CRS/nasal polyp diagnosis mix.
    mechanism: CRS with/without nasal polyps varies by clinical phenotype and age distribution.
    features: Polypoid edema, respiratory mucosa, eosinophils/neutrophils, basement membrane thickening.
    confounders: CRS phenotype, polyp status, subsite, procedure type.
    validation: Match CRS phenotype and polyp status; test residual age signal within CRS-only cases.
    literature:
      - short_citation: Fokkens et al., 2020
        citation: >-
          Fokkens WJ, Lund VJ, Hopkins C, et al. European Position Paper on Rhinosinusitis and Nasal Polyps 2020.
          Rhinology. 2020
        pmid: '32077450'
        doi: 10.4193/Rhin20.600
        url: https://pubmed.ncbi.nlm.nih.gov/32077450/
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C2
    section: clinical_context
    status: active
    hypothesis: Older patients may be enriched for sinonasal neoplasia.
    mechanism: >-
      Sinonasal malignancies and papillomas are more common in adult/older surgical specimens than pediatric
      inflammatory biopsies.
    features: SCC, adenocarcinoma, melanoma, Schneiderian papilloma, dysplasia, bone invasion, necrosis.
    confounders: Benign/malignant status, histologic subtype, stage, subsite.
    validation: Exclude tumors or match tumor histology/stage; test attenuation.
    literature:
      - short_citation: Smaadahl et al., 2024
        citation: >-
          Smaadahl N, Hool S, Reinhardt P, et al. Treatment and related morbidity of nasal cavity and paranasal sinus
          cancers. Frontiers in Oncology. 2024
        doi: 10.3389/fonc.2024.1422892
        url: https://www.frontiersin.org/journals/oncology/articles/10.3389/fonc.2024.1422892/full
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C3
    section: clinical_context
    status: active
    hypothesis: Fungal/allergic disease distribution may contribute to age signal.
    mechanism: Allergic fungal rhinosinusitis or fungal disease can shift case mix by age and clinical setting.
    features: Allergic mucin, Charcot-Leyden crystals, fungal hyphae, eosinophils, necrosis.
    confounders: Diagnosis, immunosuppression, diabetes, subsite, institution.
    validation: Match fungal/allergic diagnoses and immune status if available.
    literature:
      - short_citation: Fokkens et al., 2020
        citation: >-
          Fokkens WJ, Lund VJ, Hopkins C, et al. European Position Paper on Rhinosinusitis and Nasal Polyps 2020.
          Rhinology. 2020
        pmid: '32077450'
        doi: 10.4193/Rhin20.600
        url: https://pubmed.ncbi.nlm.nih.gov/32077450/
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C4
    section: clinical_context
    status: active
    hypothesis: Procedure type may encode age.
    mechanism: >-
      Pediatric/young adult biopsies, polypectomies, sinus surgeries, and cancer resections differ in tissue
      composition.
    features: Small biopsy vs functional endoscopic sinus surgery vs resection, bone/cartilage, margin/treatment tissue.
    confounders: Procedure type, subsite, diagnosis.
    validation: Stratify by procedure type and tissue source.
    literature:
      - short_citation: Fokkens et al., 2020
        citation: >-
          Fokkens WJ, Lund VJ, Hopkins C, et al. European Position Paper on Rhinosinusitis and Nasal Polyps 2020.
          Rhinology. 2020
        pmid: '32077450'
        doi: 10.4193/Rhin20.600
        url: https://pubmed.ncbi.nlm.nih.gov/32077450/
        evidence_status: needs claim-level validation
      - short_citation: Smaadahl et al., 2024
        citation: >-
          Smaadahl N, Hool S, Reinhardt P, et al. Treatment and related morbidity of nasal cavity and paranasal sinus
          cancers. Frontiers in Oncology. 2024
        doi: 10.3389/fonc.2024.1422892
        url: https://www.frontiersin.org/journals/oncology/articles/10.3389/fonc.2024.1422892/full
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: M1
    section: histomorphology
    status: active
    hypothesis: Chronic epithelial remodeling may encode age within inflammatory disease.
    mechanism: Repeated inflammation can alter respiratory epithelium and repair state.
    features: Epithelial denudation, squamous metaplasia, goblet-cell change, basement membrane thickening.
    confounders: CRS phenotype, smoking/exposure, infection, treatment.
    validation: Quantify epithelial remodeling in CRS/polyp cases matched by endotype and subsite.
    literature:
      - short_citation: Fokkens et al., 2020
        citation: >-
          Fokkens WJ, Lund VJ, Hopkins C, et al. European Position Paper on Rhinosinusitis and Nasal Polyps 2020.
          Rhinology. 2020
        pmid: '32077450'
        doi: 10.4193/Rhin20.600
        url: https://pubmed.ncbi.nlm.nih.gov/32077450/
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: M2
    section: histomorphology
    status: active
    hypothesis: Stromal edema/fibrosis balance may vary by age or disease chronicity.
    mechanism: Chronic rhinosinusitis remodeling can produce edema, fibrosis, and glandular change.
    features: Stromal edema, fibrosis, submucosal gland hyperplasia, vascular congestion.
    confounders: Polyp status, CRS endotype, steroid treatment, subsite.
    validation: Compare stromal texture after CRS subtype and treatment matching.
    literature:
      - short_citation: Fokkens et al., 2020
        citation: >-
          Fokkens WJ, Lund VJ, Hopkins C, et al. European Position Paper on Rhinosinusitis and Nasal Polyps 2020.
          Rhinology. 2020
        pmid: '32077450'
        doi: 10.4193/Rhin20.600
        url: https://pubmed.ncbi.nlm.nih.gov/32077450/
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: M3
    section: histomorphology
    status: active
    hypothesis: Inflammatory cell composition may shift with age.
    mechanism: Age and inflammatory phenotype may alter eosinophilic vs neutrophilic patterns.
    features: Eosinophils, neutrophils, lymphoplasmacytic inflammation, lymphoid aggregates.
    confounders: CRS endotype, infection, allergy/asthma, steroid treatment.
    validation: Cell-count analysis within matched CRS endotypes; test whether inflammation explains age prediction.
    literature:
      - short_citation: Fokkens et al., 2020
        citation: >-
          Fokkens WJ, Lund VJ, Hopkins C, et al. European Position Paper on Rhinosinusitis and Nasal Polyps 2020.
          Rhinology. 2020
        pmid: '32077450'
        doi: 10.4193/Rhin20.600
        url: https://pubmed.ncbi.nlm.nih.gov/32077450/
        evidence_status: needs claim-level validation
      - short_citation: Chiu et al., 2025
        citation: Chiu RG, et al. Biological Sex and Chronic Rhinosinusitis Diagnosis, Phenotype, and Inflammatory Profile. 2025
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12550736/
        evidence_status: source metadata incomplete
    evidence_status: needs claim-level validation
  - id: M4
    section: histomorphology
    status: active
    hypothesis: Direct normal sinonasal aging morphology is weakly established.
    mechanism: Residual age signal may reflect unmeasured disease chronicity rather than intrinsic aging.
    features: Benign respiratory mucosa, glands, vessels, stroma without overt CRS/tumor.
    confounders: Subsite, inflammation, procedure, exposure.
    validation: Test benign, non-polyp, non-tumor mucosa after strict matching; require cautious interpretation.
    literature:
      - short_citation: Fokkens et al., 2020
        citation: >-
          Fokkens WJ, Lund VJ, Hopkins C, et al. European Position Paper on Rhinosinusitis and Nasal Polyps 2020.
          Rhinology. 2020
        pmid: '32077450'
        doi: 10.4193/Rhin20.600
        url: https://pubmed.ncbi.nlm.nih.gov/32077450/
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
key_takeaways:
  - The strongest clinical-context hypotheses are CRS/polyp mix, neoplasia, fungal/allergic disease, and procedure type.
  - >-
    The most plausible morphology hypotheses involve inflammatory remodeling: epithelial change, stromal edema/fibrosis,
    and inflammatory cell composition.
  - >-
    The most important validation is matching by diagnosis, CRS endotype/polyp status, benign/malignant status, subsite,
    and procedure type.
