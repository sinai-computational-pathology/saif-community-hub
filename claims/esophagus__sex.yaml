combo: esophagus__sex
organ_slug: esophagus
organ: Esophagus
demographic: sex
demographic_label: Sex
summary: >-
  Esophagus sex signal is a moderate residual candidate. The strongest literature-supported shortcut is male enrichment
  for Barrett esophagus and esophageal adenocarcinoma pathways. Residual H&E signal may reflect Barrett/glandular
  metaplasia, dysplasia, reflux injury, or subtype/site context rather than direct sex-specific esophageal morphology.
claims:
  - id: C1
    section: clinical_context
    status: active
    hypothesis: Men are overrepresented in Barrett esophagus and esophageal adenocarcinoma pathways.
    mechanism: Sex-skewed Barrett/metaplasia/cancer prevalence can create diagnosis and subtype shortcuts.
    features: Barrett intestinal metaplasia, dysplasia, adenocarcinoma, glandular mucosa.
    confounders: Barrett diagnosis, cancer status, anatomic site, age, reflux/obesity context.
    validation: Match Barrett/cancer status and compare residual sex signal in squamous-only biopsies.
    literature:
      - short_citation: van Blankenstein et al., 2005
        citation: >-
          van Blankenstein M, Looman CWN, Johnston BJ, Caygill CPJ. Age and sex distribution of the prevalence of
          Barrett's esophagus found in a primary referral endoscopy center. American Journal of Gastroenterology. 2005
        pmid: '15743353'
        evidence_status: needs claim-level validation
      - short_citation: Ward et al., 2006
        citation: >-
          Ward EM, et al. Barrett's esophagus is common in older men and women undergoing screening colonoscopy
          regardless of reflux symptoms. American Journal of Gastroenterology. 2006
        pmid: '16405528'
        evidence_status: needs claim-level validation
      - short_citation: Stabellini et al., 2022
        citation: >-
          Stabellini N, et al. Sex differences in esophageal cancer overall and by histological subtype. Scientific
          Reports. 2022
        doi: 10.1038/s41598-022-09193-x
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C2
    section: clinical_context
    status: active
    hypothesis: Histologic subtype distribution differs by sex in esophageal cancer.
    mechanism: Adenocarcinoma and squamous carcinoma have distinct H&E patterns and sex distributions.
    features: SCC vs adenocarcinoma, keratinization, gland formation, tumor site.
    confounders: Histologic subtype, stage, site, smoking/alcohol/GERD context.
    validation: Match SCC/adenocarcinoma and tumor site before interpreting residual sex signal.
    literature:
      - short_citation: Stabellini et al., 2022
        citation: >-
          Stabellini N, et al. Sex differences in esophageal cancer overall and by histological subtype. Scientific
          Reports. 2022
        doi: 10.1038/s41598-022-09193-x
        evidence_status: needs claim-level validation
      - short_citation: Sanford et al., 2019
        citation: >-
          Sanford NN, Mahal BA, Royce TJ, Pike LRG, Hwang WL. Sex Disparity and Copy Number Alterations in Esophageal
          Squamous Cell Carcinoma. Clinical Gastroenterology and Hepatology. 2019
        pmid: '30120994'
        doi: 10.1016/j.cgh.2018.08.026
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C3
    section: clinical_context
    status: active
    hypothesis: Reflux, obesity, and GE-junction sampling may mediate male-enriched Barrett pathways.
    mechanism: Clinical risk factors shift sampling toward distal esophagus/GEJ and columnar metaplasia.
    features: GEJ biopsies, cardia-type mucosa, erosive injury, Barrett surveillance fragments.
    confounders: BMI/obesity proxy, reflux diagnosis, biopsy site, age, smoking.
    validation: Match distal/GEJ site and Barrett status; test squamous-only residual sex signal.
    literature:
      - short_citation: van Blankenstein et al., 2005
        citation: >-
          van Blankenstein M, Looman CWN, Johnston BJ, Caygill CPJ. Age and sex distribution of the prevalence of
          Barrett's esophagus found in a primary referral endoscopy center. American Journal of Gastroenterology. 2005
        pmid: '15743353'
        evidence_status: needs claim-level validation
      - short_citation: Ward et al., 2006
        citation: >-
