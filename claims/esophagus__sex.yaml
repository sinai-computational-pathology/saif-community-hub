          regardless of reflux symptoms. American Journal of Gastroenterology. 2006
        pmid: '16405528'
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C4
    section: clinical_context
    status: active
    hypothesis: Treatment and procedure type may encode sex in cancer cohorts.
    mechanism: EMR/resection, ablation surveillance, and tumor resections differ from routine biopsies and may be imbalanced.
    features: EMR fragments, cautery, tumor invasion, treatment effect, surveillance biopsies.
    confounders: Procedure type, cancer status, treatment, site, institution.
    validation: Exclude treated/resection cases or match procedure type before morphology review.
    literature:
      - short_citation: Stabellini et al., 2022
        citation: >-
          Stabellini N, et al. Sex differences in esophageal cancer overall and by histological subtype. Scientific
          Reports. 2022
        doi: 10.1038/s41598-022-09193-x
        evidence_status: needs claim-level validation
      - short_citation: Odze, 2009
        citation: Odze, 2009
        evidence_status: source metadata incomplete
    evidence_status: needs claim-level validation
  - id: M1
    section: histomorphology
    status: active
    hypothesis: Barrett/glandular metaplasia is the most likely H&E-visible sex carrier.
    mechanism: Male enrichment for Barrett/EAC pathways can produce residual glandular metaplasia/dysplasia signal.
    features: Intestinal metaplasia, goblet cells, dysplasia, glandular mucosa.
    confounders: Barrett diagnosis, biopsy site, age, reflux, obesity.
    validation: Exclude Barrett and glandular mucosa; test sex signal in squamous-only biopsies.
    literature:
      - short_citation: van Blankenstein et al., 2005
        citation: >-
          van Blankenstein M, Looman CWN, Johnston BJ, Caygill CPJ. Age and sex distribution of the prevalence of
          Barrett's esophagus found in a primary referral endoscopy center. American Journal of Gastroenterology. 2005
        pmid: '15743353'
        evidence_status: needs claim-level validation
      - short_citation: Ward et al., 2006
        citation: >-
          Ward EM, et al. Barrett's esophagus is common in older men and women undergoing screening colonoscopy
          regardless of reflux symptoms. American Journal of Gastroenterology. 2006
        pmid: '16405528'
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: M2
    section: histomorphology
    status: active
    hypothesis: Direct sex morphology in normal esophageal mucosa is uncertain.
    mechanism: Hormonal/adiposity/reflux-related biology is plausible but not directly proven as routine H&E sex morphology.
    features: Basal hyperplasia, papillary elongation, chronic inflammation, eosinophils.
    confounders: Reflux, eosinophilic esophagitis, site, diagnosis.
    validation: Review benign squamous mucosa after reflux/EoE/Barrett matching.
    literature: []
    evidence_status: source metadata incomplete
  - id: M3
    section: histomorphology
    status: active
    hypothesis: Squamous versus glandular tissue composition may be enough to drive sex classification.
    mechanism: The model may separate columnar/Barrett/GEJ tissue from squamous biopsies if these are sex imbalanced.
    features: Squamous mucosa, glandular mucosa, goblet cells, cardia-type glands.
    confounders: Biopsy site, Barrett status, GEJ sampling, procedure type.
    validation: Run a tissue-compartment audit before assigning biological mechanism.
    literature:
      - short_citation: Odze, 2009
        citation: Odze, 2009
        evidence_status: source metadata incomplete
      - short_citation: van Blankenstein et al., 2005
        citation: >-
          van Blankenstein M, Looman CWN, Johnston BJ, Caygill CPJ. Age and sex distribution of the prevalence of
          Barrett's esophagus found in a primary referral endoscopy center. American Journal of Gastroenterology. 2005
        pmid: '15743353'
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: M4
    section: histomorphology
    status: active
    hypothesis: Cancer subtype morphology can masquerade as sex signal.
    mechanism: SCC and adenocarcinoma differ strongly on H&E and have sex-skewed incidence patterns.
    features: Keratinization, gland formation, mucin, desmoplasia, necrosis.
    confounders: Histologic subtype, site, stage, treatment.
    validation: Evaluate tumor-only slides with subtype/stage matched; report remaining signal separately.
    literature:
      - short_citation: Stabellini et al., 2022
        citation: >-
          Stabellini N, et al. Sex differences in esophageal cancer overall and by histological subtype. Scientific
          Reports. 2022
        doi: 10.1038/s41598-022-09193-x
        evidence_status: needs claim-level validation
      - short_citation: Sanford et al., 2019
        citation: >-
          Sanford NN, Mahal BA, Royce TJ, Pike LRG, Hwang WL. Sex Disparity and Copy Number Alterations in Esophageal
          Squamous Cell Carcinoma. Clinical Gastroenterology and Hepatology. 2019
        pmid: '30120994'
        doi: 10.1016/j.cgh.2018.08.026
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
key_takeaways:
  - 'Best review target: Barrett metaplasia, dysplasia, adenocarcinoma versus squamous histology.'
  - 'Main shortcut risk: histologic subtype, site, reflux/Barrett workup, and age.'
  - Residual sex signal should be interpreted cautiously unless present in matched squamous mucosa.
