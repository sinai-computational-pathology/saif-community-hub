  - id: M3
    section: histomorphology
    status: active
    hypothesis: Dysplasia and OPMD morphology may carry mediated race/access signal.
    mechanism: >-
      Different lesion types and dysplasia severity can change epithelial architecture and keratinization, but this
      reflects diagnostic mix and exposures rather than intrinsic ancestry morphology.
    features: >-
      Dysplasia grade, basal atypia, keratin layer, rete architecture, erythroplakia/leukoplakia context,
      lichenoid/interface inflammation.
    confounders: Lesion type, dysplasia grade, smoking/alcohol, subsite, clinical indication.
    validation: >-
      Restrict to OPMD/dysplasia cases; match grade and lesion type; quantify whether race signal persists in same-grade
      dysplasia.
