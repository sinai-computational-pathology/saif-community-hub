key_takeaways:
  - >-
    The strongest race/self-reported ancestry hypotheses are mediated signals: stage/severity, access, treatment timing,
    insurance/social vulnerability, subsite/HPV mixing, dysplasia/OPMD mix, and dental-care-related
    inflammatory/reactive diagnoses.
  - >-
    H&E-visible morphology is plausible, but mainly as a downstream carrier of tumor stage/subtype, dysplasia severity,
    ulceration/infection, and workflow rather than intrinsic oral mucosa differences.
  - >-
    The most important validation is matching by diagnosis, stage/depth/grade, subsite, HPV/p16, specimen type,
    treatment status, institution, and available insurance/SES or oral-health access proxies.
