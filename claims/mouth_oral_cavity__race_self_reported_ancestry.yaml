  - id: C4
    section: clinical_context
    status: active
    hypothesis: Oral potentially malignant disorder and dysplasia case mix may differ through exposure and access pathways.
    mechanism: >-
      Tobacco/alcohol, dental care access, screening, and referral patterns can alter the sampled mix of leukoplakia,
      erythroplakia, dysplasia, and field-change biopsies.
    features: >-
      Dysplasia grade, hyperkeratosis, keratinizing atypia, erythroplakia/leukoplakia context, margin status,
      candidiasis or ulceration.
    confounders: Smoking/alcohol, subsite, clinical lesion type, dysplasia grade, biopsy indication, institution.
    validation: >-
      Match dysplasia grade and lesion type; compare within OPMD-only and dysplasia-only subsets; test whether excluding
      high-grade dysplasia attenuates race signal.
