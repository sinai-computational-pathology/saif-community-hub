  - id: C3
    section: clinical_context
    status: active
    hypothesis: >-
      HPV-related versus HPV-negative head-and-neck disease context may differ by racial/ethnic group if oral and
      oropharyngeal tissue are mixed.
    mechanism: >-
      HPV prevalence differs across racial-ethnic subgroups in head-and-neck cancer cohorts and HPV-related SCC has
      distinctive morphology, especially in oropharyngeal/tonsillar tissue that may be misclassified or co-sampled.
    features: >-
      Basaloid/non-keratinizing SCC, p16/HPV status, lymphoid-rich background, keratinizing SCC, oropharyngeal/tonsillar
      subsite labels.
    confounders: True oral cavity versus oropharynx, HPV/p16 status, smoking, tumor subtype, subsite.
    validation: >-
      Restrict to true oral cavity; separately analyze or exclude oropharyngeal/tonsillar cases; match HPV/p16 where
      available.
    literature:
      - short_citation: Ragin et al., 2016
        citation: >-
          Ragin C, Langevin SM, Marzouk M, Grandis J, Taioli E. Prevalence of HPV infection in racial-ethnic subgroups
          of head and neck cancer patients. Carcinogenesis. 2016
