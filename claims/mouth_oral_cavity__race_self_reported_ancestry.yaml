  - id: M5
    section: histomorphology
    status: active
    hypothesis: Direct intrinsic oral mucosal differences by race/self-reported ancestry are not well supported.
    mechanism: >-
      Race is not a direct biological tissue variable; residual H&E signal may reflect unmeasured context, exposure,
      access, or workflow.
    features: Benign epithelium, lamina propria, minor salivary glands after strict diagnosis/subsite/institution matching.
    confounders: Subsite, diagnosis, institution, scanner, stage, treatment, oral-health access, exposure.
    validation: >-
      Test only in benign/background tissue with strict matching and external replication; avoid biological
      interpretation unless independent ancestry/genetic or mechanistic evidence exists.
