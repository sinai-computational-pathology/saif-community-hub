      presentation.
    features: Invasion depth, necrosis, perineural invasion, bone/muscle invasion, stromal desmoplasia, margin/treatment tissue.
    confounders: Stage, depth, grade, treatment status, procedure type, subsite.
    validation: >-
      Tumor-only analysis with matched stage/depth/grade; compare attention maps before and after excluding necrosis,
      margins, and treatment-effect regions.
