combo: mouth_oral_cavity__race_self_reported_ancestry
organ_slug: mouth_oral_cavity
organ: Mouth / Oral Cavity
demographic: race_self_reported_ancestry
demographic_label: Race / Self-Reported Ancestry
summary: >-
  Race/self-reported ancestry signal in oral cavity histology should be treated as a clinical-context, access, exposure,
  and workflow signal rather than intrinsic tissue biology. The strongest candidate carriers are oral cavity squamous
  cell carcinoma stage/severity, treatment access and timing, insurance/social vulnerability, tumor subsite and HPV/p16
  mixing, oral potentially malignant disorder or dysplasia case mix, and dental-care-associated inflammatory or reactive
  lesions. Direct race-specific benign oral mucosal morphology is not established; any residual signal after strict
  matching should be interpreted as residual context or unmeasured confounding until externally replicated.
claims:
  - id: C1
    section: clinical_context
    status: active
    hypothesis: Race/self-reported ancestry signal may reflect oral cavity cancer stage at presentation.
    mechanism: >-
      Structural access, diagnostic delay, insurance, and referral patterns can shift tumor stage/severity across
      groups.
    features: >-
      Tumor size/depth proxies, invasion, necrosis, perineural invasion, lymphovascular invasion, bone/muscle invasion,
      margin specimens.
    confounders: Stage, tumor size/depth, subsite, grade, treatment status, institution, insurance/SES.
    validation: >-
      Match or adjust for stage/depth/subsite/grade; test residual race signal within stage-matched SCC and untreated
      primary-tumor subsets.
    literature:
      - short_citation: Yu et al., 2019
        citation: >-
          Yu AJ, Choi JS, Swanson MS, et al. Association of Race/Ethnicity, Stage, and Survival in Oral Cavity Squamous
          Cell Carcinoma: A SEER Study. OTO Open. 2019
        pmid: '31840132'
        doi: 10.1177/2473974X19891126
        url: https://journals.sagepub.com/doi/10.1177/2473974X19891126
        evidence_status: needs claim-level validation
      - short_citation: Tortolero et al., 2026
        citation: >-
          Tortolero G, Wang K, Elting LS, et al. The Intersection of Social Vulnerability and Oral Cavity Cancer: Racial
          Disparities and Stage at Diagnosis. JAMA Otolaryngology-Head & Neck Surgery. 2025/2026
        doi: 10.1001/jamaoto.2025.3916
        url: https://digitalcommons.library.tmc.edu/uthsph_docs/1293/
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C2
    section: clinical_context
    status: active
    hypothesis: Treatment initiation and care access may create workflow/specimen shortcuts.
    mechanism: >-
      Race/ethnicity, rurality, social vulnerability, and insurance can influence time to diagnosis or treatment,
      changing biopsy versus resection composition and treated versus untreated tissue.
    features: >-
      Biopsy vs resection, margin specimens, treatment effect, scar/radiation change, necrosis, advanced resection
      complexity.
    confounders: Institution, insurance, rurality, treatment status, procedure type, calendar year.
    validation: >-
      Stratify by procedure type and pre-treatment status; include institution and insurance/social vulnerability
      controls where available.
    literature:
