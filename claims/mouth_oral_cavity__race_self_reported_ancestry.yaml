  - id: C5
    section: clinical_context
    status: active
    hypothesis: Dental-care access and oral-health disparities may shift inflammatory, infectious, or reactive biopsy composition.
    mechanism: >-
      Differential access to dental care can affect untreated dental disease, chronic trauma, candidiasis, ulceration,
      and reactive lesions that enter oral pathology workflows.
    features: >-
      Ulceration, granulation tissue, chronic inflammation, candidiasis, pseudoepitheliomatous hyperplasia, reactive
      fibrous hyperplasia, traumatic lesions.
    confounders: Dental care access, insurance, denture/prosthetic use, oral hygiene, diagnosis, subsite, institution.
    validation: >-
      Identify reactive/infectious/inflammatory diagnoses; test whether removing ulcer/infection/reactive cases
      attenuates race signal.
    literature:
