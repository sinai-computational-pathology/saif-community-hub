  - id: M2
    section: histomorphology
    status: active
    hypothesis: IEL and lamina propria immune patterns may reflect diagnostic mix.
    mechanism: >-
      Celiac disease, infection, H. pylori-associated duodenal changes, and autoimmune context can produce
      lymphocyte-rich mucosa.
    features: IELs, plasma cells, lymphoid aggregates, eosinophils, active inflammation.
    confounders: Celiac, H. pylori, infection, medication, IBD, immune disease.
    validation: Cell-count review in diagnosis-matched biopsies; separate IEL-predominant from active-enteritis patterns.
    literature:
      - short_citation: Villanacci et al., 2020
        citation: >-
