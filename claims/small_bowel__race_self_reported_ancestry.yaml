          practical approach. Pathologica. 2020
        pmcid: PMC7931573
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7931573/
        evidence_status: source metadata incomplete
    evidence_status: needs claim-level validation
  - id: C4
    section: clinical_context
    status: active
    hypothesis: Normal or nonspecific biopsies may encode workflow rather than biology.
    mechanism: >-
      Race-associated health-care access and endoscopy thresholds can alter the fraction of normal/nonspecific
      small-bowel biopsies.
    features: Normal villi, mild chronic inflammation, nonspecific IELs, tissue quantity/orientation.
    confounders: Procedure indication, site, pathologist reporting style, institution.
    validation: Audit normal-biopsy rate and report text categories by demographic group.
    literature:
      - short_citation: Lebwohl et al., 2012
        citation: >-
          Lebwohl B, Tennyson CA, Holub JL, et al. Sex and racial disparities in duodenal biopsy to evaluate for celiac
          disease. Gastrointestinal Endoscopy. 2012
