  - id: M4
    section: histomorphology
    status: active
    hypothesis: Direct benign race-specific small-bowel morphology is not established.
    mechanism: >-
      Any persistent signal in normal mucosa may reflect unmeasured diet, microbiome, geography, sectioning, or
      reporting workflow.
    features: Normal villous architecture, subtle IELs, goblet/Paneth cell distribution, orientation.
    confounders: Diet/geography, endoscopy indication, lab/site, orientation, tissue quality.
    validation: Treat residual normal-mucosa signal as exploratory; require manual review and external validation.
    literature:
      - short_citation: Lebwohl et al., 2012
