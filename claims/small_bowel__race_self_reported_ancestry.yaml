key_takeaways:
  - This combo should be reviewed primarily as a workflow/disease-prevalence hypothesis.
  - The most visible H&E carrier is villous atrophy/IEL/crypt hyperplasia, especially celiac-compatible injury.
  - The main guardrail is to avoid interpreting socially defined race as intrinsic small-bowel morphology.
