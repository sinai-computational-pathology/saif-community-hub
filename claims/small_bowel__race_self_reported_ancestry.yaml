        pmcid: PMC4955830
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4955830/
        evidence_status: source metadata incomplete
    evidence_status: needs claim-level validation
  - id: M1
    section: histomorphology
    status: active
    hypothesis: Villous atrophy pattern may mediate much of the apparent race/ancestry signal.
    mechanism: Ethnic variation in celiac-compatible villous atrophy changes overt mucosal architecture.
    features: Villus height, crypt depth, villus:crypt ratio, Marsh pattern, IEL density.
    confounders: Celiac diagnosis, gluten exposure, HLA/geography, H. pylori, age/sex.
    validation: Morphometrically compare villous architecture after celiac-grade matching.
    literature:
      - short_citation: Krigel et al., 2016
        citation: >-
          Krigel A, Turner KO, Makharia GK, et al. Ethnic Variations in Duodenal Villous Atrophy Consistent with Celiac
