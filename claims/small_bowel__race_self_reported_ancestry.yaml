  - id: M3
    section: histomorphology
    status: active
    hypothesis: Crohn/infectious patterns can produce localized morphology unrelated to intrinsic ancestry.
    mechanism: Granulomatous or ulcerative injury may track geography, exposure, or care pathway.
    features: Granulomas, fissuring ulcers, chronic active inflammation, parasites, eosinophils.
    confounders: Crohn diagnosis, infection testing, travel/geography, medication, site.
    validation: Exclude Crohn/infection or match these categories before interpreting residual signal.
    literature:
      - short_citation: Zheng et al., 2022
        citation: >-
