  - id: C3
    section: clinical_context
    status: active
    hypothesis: Background density and breast composition may vary by race/ethnicity and BMI.
    mechanism: >-
      Mammographic density reflects epithelial/fibrous vs adipose composition and varies with age, BMI, parity,
      menopausal status, and race/ethnicity.
    features: Fibroglandular fraction, adipose fraction, stromal density, collagen texture, lobular density.
    confounders: BMI, age, parity, menopausal status, sampling site, benign vs tumor-adjacent tissue.
    validation: Review benign/background tissue only; match BMI/age/menopause if available.
    literature:
