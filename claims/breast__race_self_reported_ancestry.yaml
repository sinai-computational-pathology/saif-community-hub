  - id: M2
    section: histomorphology
    status: active
    hypothesis: Tumor immune microenvironment may contribute to residual signal.
    mechanism: >-
      Race-associated differences in TNBC immune microenvironment have been reported, though interpretation must
      separate biology from context.
    features: TIL density, stromal lymphocytes, lymphoid aggregates, necrosis-associated inflammation.
    confounders: Subtype, grade, treatment, tumor size, fixation, institution.
    validation: Quantify TILs within matched TNBC cases and validate externally.
    literature:
