  - id: M1
    section: histomorphology
    status: active
    hypothesis: TNBC/basal-like morphology may be the dominant H&E carrier.
    mechanism: Subtype enrichment produces visible high-grade tumor morphology and necrosis.
    features: Nuclear grade, mitotic activity, necrosis, lymphocytic infiltrate, pushing/infiltrative border.
    confounders: ER/PR/HER2, grade, stage, treatment, age.
    validation: Within-subtype review; compare attention maps before and after subtype matching.
    literature:
