key_takeaways:
  - The strongest review priority is subtype/stage/procedure matching, especially TNBC versus non-TNBC.
  - >-
    The most plausible H&E carriers are high-grade TNBC morphology, immune infiltrates, necrosis, and background
    fibroglandular/stromal composition.
  - >-
    Any residual race signal must be interpreted through structural determinants, ancestry limitations, and care-pathway
    confounding.
