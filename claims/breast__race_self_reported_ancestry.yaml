    evidence_status: needs claim-level validation
  - id: C2
    section: clinical_context
    status: active
    hypothesis: Stage, screening, and treatment access can produce race-associated pathology context.
    mechanism: >-
      Structural inequities influence stage at presentation, treatment timing, and procedure mix, creating H&E-visible
      case-mix differences.
    features: Tumor size surrogate, nodal/metastatic context, resection vs biopsy, treatment effect, margins.
    confounders: Stage, procedure type, neoadjuvant therapy, screening status, institution/access proxies.
    validation: Match stage/procedure/treatment status; audit whether signal disappears after care-pathway matching.
    literature:
      - short_citation: Reeder-Hayes et al., 2023
        citation: >-
          Reeder-Hayes K, Roberson ML, Wheeler SB, Abdou Y, Troester MA. From Race to Racism and Disparities to Equity:
          An Actionable Biopsychosocial Approach to Breast Cancer Outcomes. Cancer Journal. 2023;29(6):316-322
