  - id: C4
    section: clinical_context
    status: active
    hypothesis: Benign breast disease and biopsy indication may differ by access and screening pathway.
    mechanism: >-
      Screening intensity and diagnostic follow-up influence benign biopsies, high-risk lesions, and surgical excision
      mix.
    features: Fibrocystic change, fibroadenoma, papilloma, atypia, DCIS, biopsy vs excision.
    confounders: Diagnosis, screening indication, procedure type, age, institution.
    validation: Stratify benign lesions and DCIS/invasive cancer separately.
