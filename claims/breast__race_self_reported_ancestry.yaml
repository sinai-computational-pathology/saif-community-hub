  - id: M3
    section: histomorphology
    status: active
    hypothesis: Stromal/collagen and density-related background tissue may encode case composition.
    mechanism: >-
      Mammographic density and collagen structure relate to breast cancer risk and may vary with race/ethnicity through
      BMI and reproductive factors.
    features: Collagen density, stromal texture, fibroglandular vs adipose composition, TDLU density.
    confounders: BMI, age, parity, menopause, sampling site, tumor adjacency.
    validation: Analyze benign/background tissue excluding tumor; match BMI/reproductive variables if available.
    literature:
