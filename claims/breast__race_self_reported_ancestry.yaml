  - id: M4
    section: histomorphology
    status: active
    hypothesis: Direct intrinsic race-specific benign breast morphology is not established.
    mechanism: >-
      Persistent signal outside tumor/subtype/density may reflect unmeasured socioeconomic, reproductive, obesity, or
      workflow variables.
    features: Benign lobules, ducts, stroma, adipose, inflammation.
    confounders: BMI, parity, menopause, screening, institution, procedure type.
    validation: Treat as exploratory; require reviewer confirmation and DOI-backed added references.
    literature:
