combo: breast__race_self_reported_ancestry
organ_slug: breast
organ: Breast
demographic: race_self_reported_ancestry
demographic_label: Race / Self-Reported Ancestry
summary: >-
  Breast race or ancestry signal should be framed as a mixture of tumor subtype, screening/access context, treatment
  pathway, body composition, and tumor microenvironment hypotheses. The most literature-supported H&E-visible carriers
  are triple-negative/basal-like tumor enrichment, higher grade, necrosis, stromal and immune features, and
  mammographic-density-related fibroglandular composition. This page should not be interpreted as evidence of intrinsic
  racial morphology; race is a social and imperfect proxy for ancestry, structural exposure, and care access.
claims:
  - id: C1
    section: clinical_context
    status: active
    hypothesis: Race-associated breast signal may be driven by tumor subtype distribution.
    mechanism: >-
      Triple-negative and basal-like breast cancers are more common among Black/African American women in many U.S.
      cohorts.
    features: ER/PR/HER2 status, TNBC/basal-like morphology, high grade, pushing borders, necrosis.
    confounders: Tumor subtype, grade, age, stage, treatment status, institution.
    validation: Match ER/PR/HER2 subtype and grade; test whether race signal persists within TNBC-only and non-TNBC-only sets.
    literature:
      - short_citation: Lund et al., 2009
        citation: >-
          Lund MJ, Trivers KF, Porter PL, et al. Race and triple negative threats to breast cancer survival: a
          population-based study in Atlanta, GA. Breast Cancer Research and Treatment. 2009;113(2):357-370
        pmid: '18324472'
        doi: 10.1007/s10549-008-9926-3
        url: https://pubmed.ncbi.nlm.nih.gov/18324472/
        evidence_status: needs claim-level validation
      - short_citation: Dietze et al., 2015
        citation: >-
          Dietze EC, Sistrunk C, Miranda-Carboni G, O'Regan R, Seewaldt VL. Triple-negative breast cancer in
          African-American women: disparities versus biology. Nature Reviews Cancer. 2015;15(4):248-254
        pmid: '25673085'
        pmcid: PMC5470637
        doi: 10.1038/nrc3896
        url: https://pubmed.ncbi.nlm.nih.gov/25673085/
        evidence_status: needs claim-level validation
      - short_citation: Torres et al., 2024
