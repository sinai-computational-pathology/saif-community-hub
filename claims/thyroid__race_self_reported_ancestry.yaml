combo: thyroid__race_self_reported_ancestry
organ_slug: thyroid
organ: Thyroid
demographic: race_self_reported_ancestry
demographic_label: Race / Self-Reported Ancestry
summary: >-
  Race/self-reported ancestry signal in thyroid histology is expected to be mostly clinical-context mediated. Candidate
  shortcuts include thyroid cancer incidence/detection, histology/stage distributions, nodule workup, autoimmune thyroid
  disease evaluation, iodine/geography, access, and institution/procedure mix. Direct intrinsic race-specific thyroid
  morphology is not established.
claims:
  - id: C1
    section: clinical_context
    status: active
    hypothesis: Race signal may reflect thyroid cancer incidence or detection differences.
    mechanism: Population incidence and detection patterns vary by race/ethnicity.
    features: Benign vs malignant, papillary thyroid carcinoma, tumor foci, thyroidectomy specimens.
    confounders: Diagnosis, tumor subtype, stage/size, institution, access.
    validation: Match benign/malignant status and tumor subtype/stage.
    literature:
      - short_citation: Magreni et al., 2015
        citation: >-
          Magreni A, Bann DV, Schubart JR, Goldenberg D. The effects of race and ethnicity on thyroid cancer incidence.
          JAMA Otolaryngology-Head & Neck Surgery. 2015
        pmid: '25654447'
        doi: 10.1001/jamaoto.2014.3740
        url: https://jamanetwork.com/journals/jamaotolaryngology/fullarticle/2108342
        evidence_status: needs claim-level validation
      - short_citation: Meza & Chang, 2015
        citation: >-
          Meza R, Chang JT. Multistage carcinogenesis and the incidence of thyroid cancer in the US by sex, race, stage
          and histology. BMC Public Health. 2015
        doi: 10.1186/s12889-015-2108-4
        url: https://bmcpublichealth.biomedcentral.com/articles/10.1186/s12889-015-2108-4
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C2
    section: clinical_context
    status: active
    hypothesis: Histologic subtype or stage distribution may mediate signal.
    mechanism: Differences in histology/stage can produce visible tumor morphology.
    features: Papillary variants, follicular-pattern lesions, aggressive features, invasion.
    confounders: Histologic subtype, stage, tumor size, treatment.
    validation: Cancer-only analysis matched by histologic subtype and stage.
    literature:
      - short_citation: Meza & Chang, 2015
        citation: >-
          Meza R, Chang JT. Multistage carcinogenesis and the incidence of thyroid cancer in the US by sex, race, stage
          and histology. BMC Public Health. 2015
        doi: 10.1186/s12889-015-2108-4
        url: https://bmcpublichealth.biomedcentral.com/articles/10.1186/s12889-015-2108-4
        evidence_status: needs claim-level validation
      - short_citation: Finlayson et al., 2014
        citation: >-
          Finlayson A, Barnes I, Sayeed S, et al. Incidence of thyroid cancer in England by ethnic group, 2001-2007.
          British Journal of Cancer. 2014
        url: https://www.nature.com/articles/bjc20144
        evidence_status: source metadata incomplete
    evidence_status: needs claim-level validation
  - id: C3
    section: clinical_context
    status: active
    hypothesis: Nodule evaluation and surgery access may create specimen-mix shortcuts.
    mechanism: Differential access and diagnostic workup can shift nodule and procedure distributions.
    features: Nodular hyperplasia, goiter, thyroidectomy vs lobectomy, incidental tumors.
    confounders: Nodule status, procedure type, institution, insurance/access proxy.
    validation: Match nodule status/procedure and include institution controls.
    literature:
      - short_citation: Magreni et al., 2015
        citation: >-
          Magreni A, Bann DV, Schubart JR, Goldenberg D. The effects of race and ethnicity on thyroid cancer incidence.
          JAMA Otolaryngology-Head & Neck Surgery. 2015
        pmid: '25654447'
        doi: 10.1001/jamaoto.2014.3740
        url: https://jamanetwork.com/journals/jamaotolaryngology/fullarticle/2108342
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C4
    section: clinical_context
    status: active
    hypothesis: Autoimmune/endocrine disease context may vary across groups.
    mechanism: Graves disease, TSH distribution, thyroiditis workup, and geography/iodine may alter tissue context.
    features: Graves-like hyperplasia, scalloped colloid, lymphocytic thyroiditis, germinal centers.
    confounders: Thyroiditis/Graves status, iodine/geography, sex, age.
    validation: Stratify by thyroiditis/Graves diagnosis and endocrine metadata when available.
    literature:
      - short_citation: Akamizu & Amino, 2017
        citation: Akamizu T, Amino N. Hashimoto's Thyroiditis. Endotext. Updated 2017
        url: https://www.ncbi.nlm.nih.gov/books/NBK285557/
        evidence_status: source metadata incomplete
    evidence_status: source metadata incomplete
  - id: C5
    section: clinical_context
    status: active
    hypothesis: Institution/workflow may encode race.
    mechanism: Referral patterns, scanner/site, and block selection can correlate with demographics.
    features: Scanner/stain style, tissue size, procedure type, cautery/artifact.
    confounders: Institution, scanner, year, procedure, diagnosis.
    validation: Institution-balanced and scanner-balanced evaluation.
    literature:
      - short_citation: Magreni et al., 2015
        citation: >-
          Magreni A, Bann DV, Schubart JR, Goldenberg D. The effects of race and ethnicity on thyroid cancer incidence.
          JAMA Otolaryngology-Head & Neck Surgery. 2015
        pmid: '25654447'
        doi: 10.1001/jamaoto.2014.3740
        url: https://jamanetwork.com/journals/jamaotolaryngology/fullarticle/2108342
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: M1
    section: histomorphology
    status: active
    hypothesis: Tumor morphology may mediate apparent race signal.
    mechanism: Subtype/stage differences produce visible morphology without implying intrinsic race biology.
    features: Papillary nuclear features, follicular architecture, invasion, desmoplasia.
    confounders: Tumor subtype, stage, diagnosis, treatment.
    validation: Match tumor subtype/stage; compare tumor vs background regions.
    literature:
      - short_citation: Meza & Chang, 2015
        citation: >-
          Meza R, Chang JT. Multistage carcinogenesis and the incidence of thyroid cancer in the US by sex, race, stage
          and histology. BMC Public Health. 2015
        doi: 10.1186/s12889-015-2108-4
        url: https://bmcpublichealth.biomedcentral.com/articles/10.1186/s12889-015-2108-4
        evidence_status: needs claim-level validation
      - short_citation: Finlayson et al., 2014
        citation: >-
          Finlayson A, Barnes I, Sayeed S, et al. Incidence of thyroid cancer in England by ethnic group, 2001-2007.
          British Journal of Cancer. 2014
        url: https://www.nature.com/articles/bjc20144
        evidence_status: source metadata incomplete
    evidence_status: needs claim-level validation
  - id: M2
    section: histomorphology
    status: active
    hypothesis: Autoimmune thyroiditis morphology may mediate residual signal.
    mechanism: Differences in autoimmune/endocrine context can affect inflammatory architecture.
    features: Lymphoid aggregates, germinal centers, Hurthle cells, follicular destruction, fibrosis.
    confounders: Thyroiditis status, sex, age, diagnosis.
    validation: Match thyroiditis status and inflammation grade.
    literature:
      - short_citation: Akamizu & Amino, 2017
        citation: Akamizu T, Amino N. Hashimoto's Thyroiditis. Endotext. Updated 2017
        url: https://www.ncbi.nlm.nih.gov/books/NBK285557/
        evidence_status: source metadata incomplete
    evidence_status: source metadata incomplete
  - id: M3
    section: histomorphology
    status: active
    hypothesis: Graves-like hyperplasia may mediate endocrine-context signal.
    mechanism: Thyroid functional state can alter follicular morphology.
    features: Tall follicular epithelium, scalloped colloid, hyperplastic follicles, vascularity.
    confounders: Graves diagnosis, treatment, thyroid function, iodine/geography.
    validation: Use diagnosis/endocrine metadata; test within non-Graves cases.
    literature:
      - short_citation: Akamizu & Amino, 2017
        citation: Akamizu T, Amino N. Hashimoto's Thyroiditis. Endotext. Updated 2017
        url: https://www.ncbi.nlm.nih.gov/books/NBK285557/
        evidence_status: source metadata incomplete
    evidence_status: source metadata incomplete
  - id: M4
    section: histomorphology
    status: active
    hypothesis: Direct intrinsic thyroid morphology by race is unsupported.
    mechanism: Race/self-report should not be interpreted as direct tissue biology without ancestry-linked evidence.
    features: Benign background follicles after strict matching.
    confounders: Diagnosis, nodule, thyroiditis, institution, geography, procedure.
    validation: Test matched benign background thyroid; require external replication.
    literature:
      - short_citation: Magreni et al., 2015
        citation: >-
          Magreni A, Bann DV, Schubart JR, Goldenberg D. The effects of race and ethnicity on thyroid cancer incidence.
          JAMA Otolaryngology-Head & Neck Surgery. 2015
        pmid: '25654447'
        doi: 10.1001/jamaoto.2014.3740
        url: https://jamanetwork.com/journals/jamaotolaryngology/fullarticle/2108342
        evidence_status: needs claim-level validation
      - short_citation: Meza & Chang, 2015
        citation: >-
          Meza R, Chang JT. Multistage carcinogenesis and the incidence of thyroid cancer in the US by sex, race, stage
          and histology. BMC Public Health. 2015
        doi: 10.1186/s12889-015-2108-4
        url: https://bmcpublichealth.biomedcentral.com/articles/10.1186/s12889-015-2108-4
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
key_takeaways:
  - >-
    The strongest clinical-context hypotheses are cancer detection/incidence, subtype/stage, nodule/procedure mix,
    autoimmune/endocrine context, and institution/workflow.
  - >-
    Morphology hypotheses should be framed as tumor-, thyroiditis-, Graves-, geography-, or workflow-mediated rather
    than direct race biology.
  - >-
    The most important validation is matching by diagnosis, tumor subtype/stage, nodule status, thyroiditis/Graves
    status, procedure type, institution, and scanner.
