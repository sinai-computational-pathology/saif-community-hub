combo: ovary__age
organ_slug: ovary
organ: Ovary
demographic: age
demographic_label: Age
summary: >-
  Ovary age signal is a stable residual candidate but data-limited by specimen group. The most plausible morphology
  carriers are follicle depletion, corpora albicantia, stromal fibrosis, collagen accumulation, cortical remodeling,
  vascular changes, and age-skewed tumor/cyst/procedure indications.
claims:
  - id: C1
    section: clinical_context
    status: active
    hypothesis: Ovarian disease and procedure indications vary by age.
    mechanism: >-
      Younger patients may be enriched for cysts/endometriosis/fertility-related procedures; older patients for
      neoplasia and prophylactic or postmenopausal surgery.
    features: Benign cysts, endometriosis, epithelial tumors, metastatic disease, oophorectomy indication.
    confounders: Diagnosis, procedure, tumor histotype, laterality, BRCA/prophylaxis.
    validation: Match tumor/benign category and procedure; test residual age signal in benign ovarian cortex.
    literature:
      - short_citation: Shen et al., 2023
        citation: >-
          Shen L, Liu J, Luo A, Wang S. The stromal microenvironment and ovarian aging: mechanisms and therapeutic
          opportunities. Journal of Ovarian Research. 2023
        pmid: '38093329'
        pmcid: PMC10717903
        doi: 10.1186/s13048-023-01300-4
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C2
    section: clinical_context
    status: active
    hypothesis: Tumor histotype and malignancy context can create age shortcuts.
    mechanism: High-grade serous carcinoma and other neoplasms have age distributions and strong H&E patterns.
    features: Tumor histotype, grade, necrosis, stromal invasion, treatment effect.
    confounders: Histotype, grade, stage, treatment, tissue sampling.
    validation: Exclude neoplastic cases or match histotype/stage before morphology interpretation.
    literature:
      - short_citation: Shen et al., 2023
        citation: >-
          Shen L, Liu J, Luo A, Wang S. The stromal microenvironment and ovarian aging: mechanisms and therapeutic
          opportunities. Journal of Ovarian Research. 2023
        pmid: '38093329'
        pmcid: PMC10717903
        doi: 10.1186/s13048-023-01300-4
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C3
    section: clinical_context
    status: active
    hypothesis: Endometriosis and functional cyst indications may enrich younger cases.
    mechanism: Reproductive-age disease mix changes benign ovarian morphology and procedure pathways.
    features: Endometriosis, hemorrhagic cyst, corpus luteum, follicular cyst, adhesions.
    confounders: Diagnosis, cycle/reproductive status, procedure type, hormonal therapy.
    validation: Stratify benign cyst/endometriosis cases separately from tumor/prophylactic cases.
    literature:
      - short_citation: Shen et al., 2023
        citation: >-
          Shen L, Liu J, Luo A, Wang S. The stromal microenvironment and ovarian aging: mechanisms and therapeutic
          opportunities. Journal of Ovarian Research. 2023
        pmid: '38093329'
        pmcid: PMC10717903
        doi: 10.1186/s13048-023-01300-4
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C4
    section: clinical_context
    status: active
    hypothesis: Prophylactic oophorectomy and postmenopausal adnexal mass workups may enrich older cases.
    mechanism: >-
      Risk-reduction surgery and malignancy exclusion alter amount of benign cortex, tube/ovary, and tumor tissue
      sampled.
    features: Benign cortex, inclusion cysts, serous tubal intraepithelial carcinoma if present, epithelial tumor.
    confounders: BRCA/prophylaxis, menopause, tube inclusion, procedure type.
    validation: Match indication and procedure type before reviewing age biology.
    literature:
      - short_citation: Shen et al., 2023
        citation: >-
          Shen L, Liu J, Luo A, Wang S. The stromal microenvironment and ovarian aging: mechanisms and therapeutic
          opportunities. Journal of Ovarian Research. 2023
        pmid: '38093329'
        pmcid: PMC10717903
        doi: 10.1186/s13048-023-01300-4
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: M1
    section: histomorphology
    status: active
    hypothesis: Ovarian aging is associated with stromal fibrosis and collagen remodeling.
    mechanism: Aging stromal microenvironment accumulates collagen/fibrosis and changes stiffness.
    features: Cortical stromal fibrosis, collagen density, stromal cellularity, hyalinization.
    confounders: Tumor desmoplasia, endometriosis, inflammation, sampling site.
    validation: Quantify stromal collagen in benign cortex after diagnosis matching.
    literature:
      - short_citation: Briley et al., 2016
        citation: >-
          Briley SM, Jasti S, McCracken JM, et al. Reproductive age-associated fibrosis in the stroma of the mammalian
          ovary. Reproduction. 2016
        pmid: '27491879'
        pmcid: PMC4979755
        doi: 10.1530/REP-16-0129
        evidence_status: needs claim-level validation
      - short_citation: Shen et al., 2023
        citation: >-
          Shen L, Liu J, Luo A, Wang S. The stromal microenvironment and ovarian aging: mechanisms and therapeutic
          opportunities. Journal of Ovarian Research. 2023
        pmid: '38093329'
        pmcid: PMC10717903
        doi: 10.1186/s13048-023-01300-4
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: M2
    section: histomorphology
    status: active
    hypothesis: Follicle depletion and corpora albicantia encode reproductive age.
    mechanism: Ovarian reserve declines with age, altering follicle density and cortical composition.
    features: Primordial/primary follicles, corpora albicantia, cortical thickness.
    confounders: Tissue sampling, cyst/tumor replacement, prior surgery, endocrine status.
    validation: Restrict to benign cortex-containing slides and quantify follicle/corpora features.
    literature:
      - short_citation: Shen et al., 2023
        citation: >-
          Shen L, Liu J, Luo A, Wang S. The stromal microenvironment and ovarian aging: mechanisms and therapeutic
          opportunities. Journal of Ovarian Research. 2023
        pmid: '38093329'
        pmcid: PMC10717903
        doi: 10.1186/s13048-023-01300-4
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: M3
    section: histomorphology
    status: active
    hypothesis: Vascular and immune microenvironment changes may contribute.
    mechanism: Aging ovary remodels stromal/vascular/immune niches.
    features: Vascular density/sclerosis, inflammatory cells, stromal edema/fibrosis.
    confounders: Tumor, endometriosis, inflammation, fixation.
    validation: Pathologist review of benign stromal regions matched by diagnosis.
    literature:
      - short_citation: Shen et al., 2023
        citation: >-
          Shen L, Liu J, Luo A, Wang S. The stromal microenvironment and ovarian aging: mechanisms and therapeutic
          opportunities. Journal of Ovarian Research. 2023
        pmid: '38093329'
        pmcid: PMC10717903
        doi: 10.1186/s13048-023-01300-4
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: M4
    section: histomorphology
    status: active
    hypothesis: Inclusion cysts and epithelial invaginations may act as age-associated background features.
    mechanism: Repeated ovulation and aging can alter ovarian surface/cortical epithelial structures.
    features: Inclusion cysts, surface epithelium, cortical invaginations, stromal scarring.
    confounders: Sampling site, tumor adjacency, endometriosis, prophylactic surgery.
    validation: Score benign cortex features after excluding tumors and endometriosis.
    literature:
      - short_citation: Shen et al., 2023
        citation: >-
          Shen L, Liu J, Luo A, Wang S. The stromal microenvironment and ovarian aging: mechanisms and therapeutic
          opportunities. Journal of Ovarian Research. 2023
        pmid: '38093329'
        pmcid: PMC10717903
        doi: 10.1186/s13048-023-01300-4
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
key_takeaways:
  - 'Best review target: benign ovarian cortex, follicle density, corpora albicantia, and stromal collagen/fibrosis.'
  - 'Main shortcut risk: neoplastic histotype and procedure indication.'
  - Data-limited flag means pathologist review should check sample adequacy and benign cortex availability.
