  - id: M1
    section: histomorphology
    status: active
    hypothesis: Sex may influence eosinophilic versus neutrophilic CRS inflammation.
    mechanism: Sex-linked immune regulation may alter inflammatory profiles.
    features: Eosinophils, neutrophils, lymphoplasmacytic inflammation, allergic mucin.
    confounders: CRS endotype, allergy/asthma, infection, steroids.
    validation: Cell-count analysis within CRS/polyp matched subsets.
    literature:
