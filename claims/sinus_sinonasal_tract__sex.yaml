  - id: M2
    section: histomorphology
    status: active
    hypothesis: Sex may influence stromal remodeling in nasal polyps/CRS.
    mechanism: Inflammatory pathways can alter edema, fibrosis, glands, and basement membrane thickening.
    features: Edema, fibrosis, basement membrane thickening, glandular hyperplasia, epithelial remodeling.
    confounders: CRS phenotype, treatment, subsite, chronicity.
    validation: Quantify remodeling features after endotype and treatment matching.
    literature:
      - short_citation: Fokkens et al., 2020
        citation: >-
