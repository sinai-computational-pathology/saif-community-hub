        evidence_status: source metadata incomplete
    evidence_status: needs claim-level validation
  - id: M3
    section: histomorphology
    status: active
    hypothesis: Tumor histology may mediate apparent sex morphology.
    mechanism: Sex-associated cancer subtype distribution produces visible morphology differences.
    features: SCC/adenocarcinoma/melanoma subtype, necrosis, invasion, desmoplasia.
    confounders: Tumor subtype, stage, exposure, treatment.
    validation: Tumor-only analysis matched by histology/stage.
    literature:
