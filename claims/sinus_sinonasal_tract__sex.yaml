combo: sinus_sinonasal_tract__sex
organ_slug: sinus_sinonasal_tract
organ: Sinus / Sinonasal Tract
demographic: sex
demographic_label: Sex
summary: >-
  Sex signal in sinonasal histology is likely mixed but substantially clinical-context mediated. Male predominance in
  some sinonasal cancers may reflect occupational exposures, smoking, and histologic subtype. CRS phenotype and
  inflammatory profile may also vary by sex, potentially producing H&E-visible inflammatory and stromal remodeling
  differences.
claims:
  - id: C1
    section: clinical_context
    status: active
    hypothesis: Male patients may be enriched for sinonasal malignancy.
    mechanism: Sinonasal cancer incidence and exposure-linked cancers can show male predominance.
    features: SCC, adenocarcinoma, melanoma, necrosis, invasion, resection specimens.
    confounders: Benign/malignant status, histologic subtype, occupation, smoking, stage.
    validation: Match benign/malignant status and tumor histology/stage.
    literature:
      - short_citation: Binazzi et al., 2024
        citation: >-
          Binazzi A, di Marzio D, Mensi C, et al. Gender Differences in Sinonasal Cancer Incidence: Data from the
          Italian Registry. Cancers. 2024
        doi: 10.3390/cancers16112053
        url: https://www.mdpi.com/2072-6694/16/11/2053
        evidence_status: needs claim-level validation
      - short_citation: Smaadahl et al., 2024
        citation: >-
          Smaadahl N, Hool S, Reinhardt P, et al. Treatment and related morbidity of nasal cavity and paranasal sinus
          cancers. Frontiers in Oncology. 2024
        doi: 10.3389/fonc.2024.1422892
        url: https://www.frontiersin.org/journals/oncology/articles/10.3389/fonc.2024.1422892/full
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C2
    section: clinical_context
    status: active
    hypothesis: Occupational exposure may mediate sex signal.
    mechanism: Wood dust/industrial exposure patterns can affect sinonasal adenocarcinoma risk.
    features: Intestinal-type adenocarcinoma, dysplasia, respiratory epithelial injury.
    confounders: Occupation, tumor subtype, subsite, smoking.
    validation: Use occupational metadata if available; otherwise match tumor histology/subsite.
    literature:
      - short_citation: Binazzi et al., 2024
        citation: >-
          Binazzi A, di Marzio D, Mensi C, et al. Gender Differences in Sinonasal Cancer Incidence: Data from the
          Italian Registry. Cancers. 2024
        doi: 10.3390/cancers16112053
        url: https://www.mdpi.com/2072-6694/16/11/2053
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C3
    section: clinical_context
    status: active
    hypothesis: CRS diagnosis and phenotype may differ by sex.
    mechanism: Biological sex may associate with CRS diagnosis, phenotype, and inflammatory profile.
    features: CRS with/without polyps, eosinophils/neutrophils, edema, fibrosis.
    confounders: CRS phenotype, asthma/allergy, steroid treatment, subsite.
    validation: Match CRS phenotype/endotype and comorbid allergy/asthma.
    literature:
      - short_citation: Chiu et al., 2025
        citation: Chiu RG, et al. Biological Sex and Chronic Rhinosinusitis Diagnosis, Phenotype, and Inflammatory Profile. 2025
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12550736/
