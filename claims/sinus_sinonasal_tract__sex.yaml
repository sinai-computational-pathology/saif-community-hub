key_takeaways:
  - >-
    The strongest clinical-context hypotheses are malignancy/subtype, occupational exposure, CRS phenotype, and
    procedure type.
  - >-
    The strongest morphology hypotheses are inflammatory cell composition and CRS remodeling, not generic sex-specific
    sinonasal anatomy.
  - >-
    The most important validation is matching by diagnosis, CRS endotype, tumor subtype/stage, subsite, exposure proxy,
    and procedure type.
