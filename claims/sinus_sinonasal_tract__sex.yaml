  - id: M4
    section: histomorphology
    status: active
    hypothesis: Direct sex-specific benign sinonasal morphology remains uncertain.
    mechanism: Residual signal in benign mucosa may reflect unmeasured inflammatory/endotype context.
    features: Benign respiratory epithelium, glands, stroma, vessels.
    confounders: Subsite, inflammation, CRS endotype, treatment.
    validation: Test benign non-tumor, endotype-matched mucosa; interpret cautiously.
    literature:
      - short_citation: Fokkens et al., 2020
