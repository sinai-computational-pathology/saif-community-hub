          Fokkens WJ, Lund VJ, Hopkins C, et al. European Position Paper on Rhinosinusitis and Nasal Polyps 2020.
          Rhinology. 2020
        pmid: '32077450'
        doi: 10.4193/Rhin20.600
        url: https://pubmed.ncbi.nlm.nih.gov/32077450/
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C4
    section: clinical_context
    status: active
    hypothesis: Procedure type may differ by sex through tumor or CRS pathways.
    mechanism: Different case mix can affect biopsy/resection/polypectomy distribution.
    features: Biopsy vs sinus surgery vs tumor resection, margins, bone/cartilage, treatment effect.
    confounders: Diagnosis, procedure type, institution.
    validation: Stratify by procedure type and diagnosis category.
    literature:
