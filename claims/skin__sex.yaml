    evidence_status: needs claim-level validation
key_takeaways:
  - 'Best review target: dermal thickness/collagen, elastic fibers, adnexa, scar/wound ECM, and site distribution.'
  - 'Main shortcut risk: anatomic site, scar/wound status, age, and diagnosis.'
  - Strong morphology evidence exists, but site and age matching are essential.
