        pmid: '37893135'
        pmcid: PMC10604277
        doi: 10.3390/biomedicines11102653
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: M1
    section: histomorphology
    status: active
    hypothesis: Dermal thickness and collagen amount differ by sex.
    mechanism: Classic tissue studies report sex and age effects on skin thickness/collagen.
    features: Dermal thickness, collagen density, collagen bundle pattern.
    confounders: Age, body site, biopsy depth, scar, UV damage.
    validation: Quantify dermal thickness/collagen in site- and age-matched benign skin.
    literature:
      - short_citation: Shuster et al., 1975
        citation: >-
          Shuster S, Black MM, McVitie E. The influence of age and sex on skin thickness, skin collagen and density.
          British Journal of Dermatology. 1975
        pmid: '1220811'
        doi: 10.1111/j.1365-2133.1975.tb05113.x
        evidence_status: needs claim-level validation
      - short_citation: Vitellaro-Zuccarello et al., 1994
        citation: >-
          Vitellaro-Zuccarello L, Cappelletti S, Dal Pozzo Rossi V, Sari-Gorla M. Stereological analysis of collagen and
          elastic fibers in the normal human dermis. Anatomical Record. 1994
        pmid: '8154602'
        doi: 10.1002/ar.1092380202
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: M2
    section: histomorphology
    status: active
    hypothesis: Collagen and elastic-fiber proportions vary with sex and body region.
    mechanism: Stereologic dermal fiber differences can create texture/architecture signal.
    features: Collagen/elastic fibers, papillary vs reticular dermis.
    confounders: Body region, age, solar elastosis, scar.
    validation: Review attention maps for dermal fiber-rich compartments.
    literature:
      - short_citation: Vitellaro-Zuccarello et al., 1994
        citation: >-
          Vitellaro-Zuccarello L, Cappelletti S, Dal Pozzo Rossi V, Sari-Gorla M. Stereological analysis of collagen and
          elastic fibers in the normal human dermis. Anatomical Record. 1994
        pmid: '8154602'
        doi: 10.1002/ar.1092380202
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: M3
    section: histomorphology
    status: active
    hypothesis: Post-operative skin shows sex-linked ECM and adipose-associated differences.
    mechanism: Sex-linked scar ECM, collagen I/III/VI, elastin, alpha-SMA, and adipogenic markers may alter H&E texture.
    features: Scar collagen, dWAT/adipose cones, stromal cells, elastin.
    confounders: Scar status, anatomic site, prior procedure.
    validation: Separate scar/wound from non-scar skin before interpreting residual signal.
    literature:
      - short_citation: Gawronska-Kozak et al., 2023
        citation: >-
          Gawronska-Kozak B, Kopcewicz M, Machcinska-Zielinska S, et al. Gender Differences in Post-Operative Human
          Skin. Biomedicines. 2023
        pmid: '37893135'
        pmcid: PMC10604277
        doi: 10.3390/biomedicines11102653
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: M4
    section: histomorphology
    status: active
    hypothesis: Adnexal density and hair-bearing site composition may be an indirect carrier.
    mechanism: Site imbalance can change follicles, sebaceous glands, sweat glands, and dermal thickness.
    features: Hair follicles, sebaceous units, eccrine glands, dermal/adipose depth.
    confounders: Anatomic site, sex-linked site sampling, diagnosis, biopsy depth.
    validation: Require site-matched benign skin review before calling direct sex morphology.
    literature:
      - short_citation: Dąbrowska et al., 2018
        citation: >-
