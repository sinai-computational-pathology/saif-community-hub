combo: skin__sex
organ_slug: skin
organ: Skin
demographic: sex
demographic_label: Sex
summary: >-
  Skin sex signal is context-sensitive but remains high priority. Literature supports sex-linked skin thickness,
  collagen, elastic-fiber proportions, topography, scar/wound ECM, dermal white adipose context, and hormone-sensitive
  adnexal structures. Site, age, scar/wound status, cosmetic/dermatology utilization, and diagnosis mix are major
  confounders.
claims:
  - id: C1
    section: clinical_context
    status: active
    hypothesis: Sex differences in skin specimen site and dermatology utilization may create shortcuts.
    mechanism: Hair-bearing/cosmetic sites, melanoma/non-melanoma cancer patterns, and scar/procedure contexts can differ by sex.
    features: Anatomic site, lesion type, scar, hair follicles, sebaceous units, tumor subtype.
    confounders: Site, diagnosis, procedure, age, UV exposure.
    validation: Match anatomic site and diagnosis; audit scar/wound and cosmetic-procedure contexts.
    literature:
      - short_citation: Dąbrowska et al., 2018
        citation: >-
          Dąbrowska M, Mielcarek A, Nowak I. Evaluation of sex-related changes in skin topography and structure using
          innovative skin testing equipment. Skin Research and Technology. 2018
        pmid: '29707820'
        doi: 10.1111/srt.12473
        evidence_status: needs claim-level validation
      - short_citation: Gawronska-Kozak et al., 2023
        citation: >-
          Gawronska-Kozak B, Kopcewicz M, Machcinska-Zielinska S, et al. Gender Differences in Post-Operative Human
          Skin. Biomedicines. 2023
        pmid: '37893135'
        pmcid: PMC10604277
        doi: 10.3390/biomedicines11102653
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C2
    section: clinical_context
    status: active
    hypothesis: Scar/wound specimens can encode sex through post-operative ECM differences.
    mechanism: Wound healing and scar ECM composition may differ by sex.
    features: Scar collagen, alpha-SMA-rich stroma, elastin, dermal adipose, inflammation.
    confounders: Scar diagnosis, procedure timing, site, age.
    validation: Exclude scar/wound specimens or stratify them separately.
    literature:
      - short_citation: Gawronska-Kozak et al., 2023
        citation: >-
          Gawronska-Kozak B, Kopcewicz M, Machcinska-Zielinska S, et al. Gender Differences in Post-Operative Human
          Skin. Biomedicines. 2023
        pmid: '37893135'
        pmcid: PMC10604277
        doi: 10.3390/biomedicines11102653
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C3
    section: clinical_context
    status: active
    hypothesis: Skin cancer subtype and site distributions may differ by sex.
    mechanism: UV exposure, behavior, hair-bearing sites, and screening can alter melanoma and keratinocytic lesion mix.
    features: Melanoma, SCC/BCC, actinic keratosis, solar elastosis, anatomic site.
    confounders: Diagnosis, sun-exposed site, age, geography, procedure type.
    validation: Match diagnosis and sun-exposed site before interpreting residual sex morphology.
    literature:
      - short_citation: Dąbrowska et al., 2018
        citation: >-
          Dąbrowska M, Mielcarek A, Nowak I. Evaluation of sex-related changes in skin topography and structure using
          innovative skin testing equipment. Skin Research and Technology. 2018
        pmid: '29707820'
        doi: 10.1111/srt.12473
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C4
    section: clinical_context
    status: active
    hypothesis: Cosmetic/procedural and inflammatory biopsy patterns may mediate sex signal.
    mechanism: Dermatology utilization and procedure patterns can alter scars, nevi, alopecia, and inflammatory lesion mix.
    features: Scar, nevus, alopecia/scalp, inflammatory dermatoses, biopsy size/depth.
    confounders: Diagnosis, site, procedure, institution, age.
    validation: Audit diagnosis/site/procedure distributions within S3 clusters.
    literature:
      - short_citation: Dąbrowska et al., 2018
        citation: >-
          Dąbrowska M, Mielcarek A, Nowak I. Evaluation of sex-related changes in skin topography and structure using
          innovative skin testing equipment. Skin Research and Technology. 2018
        pmid: '29707820'
        doi: 10.1111/srt.12473
        evidence_status: needs claim-level validation
      - short_citation: Gawronska-Kozak et al., 2023
        citation: >-
