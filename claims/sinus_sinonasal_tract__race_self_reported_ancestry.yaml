combo: sinus_sinonasal_tract__race_self_reported_ancestry
organ_slug: sinus_sinonasal_tract
organ: Sinus / Sinonasal Tract
demographic: race_self_reported_ancestry
demographic_label: Race / Self-Reported Ancestry
summary: >-
  Race/self-reported ancestry signal in sinonasal histology is expected to be mainly clinical-context, exposure, access,
  and workflow mediated. Candidate mechanisms include disparities in CRS care, environmental/occupational exposures,
  surgery access, cancer stage, and histologic subtype. Direct race-specific sinonasal tissue morphology is not
  established.
claims:
  - id: C1
    section: clinical_context
    status: active
    hypothesis: Race signal may reflect disparities in CRS diagnosis and surgical access.
    mechanism: Access and referral patterns can alter who reaches sinus surgery and what disease severity is sampled.
    features: CRS/polyp tissue, eosinophilic/neutrophilic inflammation, fibrosis, extent of surgery.
    confounders: Institution, insurance/SES, CRS phenotype, procedure type.
    validation: Use institution/procedure controls and CRS-specific cohorts if metadata exist.
    literature:
      - short_citation: Whitehead et al., 2025
        citation: >-
          Whitehead RA, et al. A Systematic Review of Health Disparities in Chronic Rhinosinusitis. Otolaryngology-Head
          and Neck Surgery. 2025
        pmid: '40949889'
        url: https://pubmed.ncbi.nlm.nih.gov/40949889/
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C2
    section: clinical_context
    status: active
    hypothesis: Race signal may reflect sinonasal cancer stage and outcomes.
    mechanism: Racial/ethnic survival disparities can correlate with tumor characteristics and advanced presentation.
    features: Tumor subtype, necrosis, invasion, bone involvement, margin/treatment tissue.
    confounders: Stage, histologic subtype, subsite, treatment status, institution.
    validation: Match tumor subtype and stage; test residual signal in cancer-only subsets.
    literature:
      - short_citation: Smith et al., 2015
        citation: >-
          Smith SP, Russell JL, Chen NW, Kuo YF, Resto VA. Sinonasal Carcinoma: Racial and Ethnic Disparities in
          Survival-A Review of 4714 Patients. Otolaryngology-Head and Neck Surgery. 2015
        pmid: '26163451'
        doi: 10.1177/0194599815593277
        url: https://journals.sagepub.com/doi/10.1177/0194599815593277
        evidence_status: needs claim-level validation
      - short_citation: Sharma et al., 2021
        citation: Sharma RK, et al. Racial and ethnic disparities in paranasal sinus malignancies. Laryngoscope. 2021
        pmid: '34096200'
        doi: 10.1002/lary.29730
        url: https://pubmed.ncbi.nlm.nih.gov/34096200/
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C3
    section: clinical_context
    status: active
    hypothesis: Environmental or occupational exposures may mediate subtype mix.
    mechanism: Exposures linked to sinonasal adenocarcinoma or SCC may vary by occupation/geography/access.
    features: Adenocarcinoma, SCC, dysplasia, respiratory epithelial injury, inflammatory background.
    confounders: Occupation, smoking, subsite, tumor histology, geography.
    validation: Use tumor histology and occupational proxy metadata if available; otherwise treat as residual confounding.
    literature:
      - short_citation: Sharma et al., 2021
        citation: Sharma RK, et al. Racial and ethnic disparities in paranasal sinus malignancies. Laryngoscope. 2021
        pmid: '34096200'
        doi: 10.1002/lary.29730
        url: https://pubmed.ncbi.nlm.nih.gov/34096200/
        evidence_status: needs claim-level validation
      - short_citation: Smith et al., 2015
        citation: >-
          Smith SP, Russell JL, Chen NW, Kuo YF, Resto VA. Sinonasal Carcinoma: Racial and Ethnic Disparities in
          Survival-A Review of 4714 Patients. Otolaryngology-Head and Neck Surgery. 2015
        pmid: '26163451'
        doi: 10.1177/0194599815593277
        url: https://journals.sagepub.com/doi/10.1177/0194599815593277
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C4
    section: clinical_context
    status: active
    hypothesis: Workflow/institution effects may encode race.
    mechanism: Referral center, scanner, processing, and surgery access can correlate with self-reported race.
    features: Tissue size, biopsy/resection type, cautery, decalcification, institution/scanner metadata.
    confounders: Institution, scanner, procedure type, year, block source.
    validation: Institution- and scanner-balanced evaluation; remove edge/artifact regions.
    literature:
      - short_citation: Whitehead et al., 2025
        citation: >-
          Whitehead RA, et al. A Systematic Review of Health Disparities in Chronic Rhinosinusitis. Otolaryngology-Head
          and Neck Surgery. 2025
        pmid: '40949889'
        url: https://pubmed.ncbi.nlm.nih.gov/40949889/
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: M1
    section: histomorphology
    status: active
    hypothesis: Inflammatory endotype may mediate apparent race signal.
    mechanism: CRS endotypes can differ by exposure, access, environment, or comorbidity.
    features: Eosinophils, neutrophils, edema, fibrosis, basement membrane thickening, glands.
    confounders: CRS phenotype, allergy/asthma, infection, steroid treatment, institution.
    validation: Match CRS endotype and comorbidities; quantify inflammatory cell composition.
    literature:
      - short_citation: Fokkens et al., 2020
        citation: >-
          Fokkens WJ, Lund VJ, Hopkins C, et al. European Position Paper on Rhinosinusitis and Nasal Polyps 2020.
          Rhinology. 2020
        pmid: '32077450'
        doi: 10.4193/Rhin20.600
        url: https://pubmed.ncbi.nlm.nih.gov/32077450/
        evidence_status: needs claim-level validation
      - short_citation: Whitehead et al., 2025
        citation: >-
          Whitehead RA, et al. A Systematic Review of Health Disparities in Chronic Rhinosinusitis. Otolaryngology-Head
          and Neck Surgery. 2025
        pmid: '40949889'
        url: https://pubmed.ncbi.nlm.nih.gov/40949889/
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: M2
    section: histomorphology
    status: active
    hypothesis: Tumor morphology may mediate apparent race signal.
    mechanism: Histologic subtype and stage differences can produce visible tumor patterns.
    features: SCC vs adenocarcinoma vs melanoma, necrosis, invasion pattern, desmoplasia.
    confounders: Tumor histology, stage, subsite, treatment.
    validation: Tumor-subtype and stage-matched analysis.
    literature:
      - short_citation: Smith et al., 2015
        citation: >-
          Smith SP, Russell JL, Chen NW, Kuo YF, Resto VA. Sinonasal Carcinoma: Racial and Ethnic Disparities in
          Survival-A Review of 4714 Patients. Otolaryngology-Head and Neck Surgery. 2015
        pmid: '26163451'
        doi: 10.1177/0194599815593277
        url: https://journals.sagepub.com/doi/10.1177/0194599815593277
        evidence_status: needs claim-level validation
      - short_citation: Sharma et al., 2021
        citation: Sharma RK, et al. Racial and ethnic disparities in paranasal sinus malignancies. Laryngoscope. 2021
        pmid: '34096200'
        doi: 10.1002/lary.29730
        url: https://pubmed.ncbi.nlm.nih.gov/34096200/
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: M3
    section: histomorphology
    status: active
    hypothesis: Direct intrinsic sinonasal morphology by race is unsupported.
    mechanism: Race is not a direct biological tissue variable; residual signal likely reflects unmeasured context.
    features: Benign respiratory mucosa after strict matching.
    confounders: Subsite, diagnosis, institution, exposure, treatment.
    validation: Test matched benign mucosa; require external replication before interpretation.
    literature:
      - short_citation: Whitehead et al., 2025
        citation: >-
          Whitehead RA, et al. A Systematic Review of Health Disparities in Chronic Rhinosinusitis. Otolaryngology-Head
          and Neck Surgery. 2025
        pmid: '40949889'
        url: https://pubmed.ncbi.nlm.nih.gov/40949889/
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
key_takeaways:
  - >-
    The strongest hypotheses are CRS care/access, cancer stage/subtype, occupational/environmental exposure, and
    workflow.
  - >-
    Morphology hypotheses should be framed as endotype-, tumor-, exposure-, or access-mediated rather than direct race
    biology.
  - >-
    The most important validation is matching by diagnosis/endotype, tumor histology/stage, subsite, procedure type,
    institution, and scanner.
