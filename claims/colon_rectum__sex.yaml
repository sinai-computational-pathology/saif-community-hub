combo: colon_rectum__sex
organ_slug: colon_rectum
organ: Colon/Rectum
demographic: sex
demographic_label: Sex
summary: >-
  Colon/rectum sex signal is context-sensitive with a large Drop %. It is best treated as a disease-distribution and
  subtype-mechanism candidate. Literature supports sex differences in CRC incidence, sidedness, screening/presentation,
  molecular pathways, immune context, sex hormone signaling, and gut microbiome interactions.
claims:
  - id: C1
    section: clinical_context
    status: active
    hypothesis: Men have higher overall CRC incidence, while women have different sidedness and presentation patterns.
    mechanism: Sex-skewed incidence and location can create diagnosis/subsite shortcuts.
    features: Right vs left colon, rectum, cancer vs benign, resection vs biopsy.
    confounders: Subsite, diagnosis, procedure, age, screening status.
    validation: Match subsite and diagnosis; compare residual sex signal within benign and CRC-only strata.
    literature:
      - short_citation: Abancens et al., 2020
        citation: >-
          Abancens M, Bustos V, Harvey H, McBryan J, Harvey BJ. Sexual Dimorphism in Colon Cancer. Frontiers in
          Oncology. 2020
        evidence_status: source metadata incomplete
      - short_citation: Tsokkou et al., 2025
        citation: >-
          Tsokkou S, et al. Sex Differences in Colorectal Cancer: Epidemiology, Risk, Screening, and Molecular
          Mechanisms. 2025
        pmcid: PMC12347225
        evidence_status: source metadata incomplete
    evidence_status: source metadata incomplete
  - id: C2
    section: clinical_context
    status: active
    hypothesis: Sex differences in screening and molecular subtype can alter observed morphology.
    mechanism: MSI/serrated/right-sided patterns and screening detection may differ by sex.
    features: Serrated lesions, mucinous tumors, TILs, lymphoid aggregates, grade.
    confounders: MSI/MMR, serrated pathway, site, age.
    validation: Audit MSI/MMR and serrated-pathway markers where available.
    literature:
      - short_citation: Tsokkou et al., 2025
        citation: >-
          Tsokkou S, et al. Sex Differences in Colorectal Cancer: Epidemiology, Risk, Screening, and Molecular
          Mechanisms. 2025
        pmcid: PMC12347225
        evidence_status: source metadata incomplete
      - short_citation: Wu et al., 2024
        citation: Wu Z, et al. Sex differences in colorectal cancer with a focus on the sex hormone-gut microbiome axis. 2024
        pmcid: PMC10921775
        evidence_status: source metadata incomplete
    evidence_status: source metadata incomplete
  - id: C3
    section: clinical_context
    status: active
    hypothesis: Procedure mix may differ by sex through screening and symptom pathways.
    mechanism: Colonoscopy biopsies, polypectomies, colectomies, and rectal cancer resections have different tissue composition.
    features: Biopsy vs polypectomy vs colectomy, adenoma/serrated lesion, cancer resection.
    confounders: Procedure type, site, diagnosis, screening vs symptom indication.
    validation: Match procedure and anatomic site; audit whether sex signal follows specimen type.
    literature:
      - short_citation: Abancens et al., 2020
        citation: >-
          Abancens M, Bustos V, Harvey H, McBryan J, Harvey BJ. Sexual Dimorphism in Colon Cancer. Frontiers in
          Oncology. 2020
        evidence_status: source metadata incomplete
      - short_citation: Tsokkou et al., 2025
        citation: >-
          Tsokkou S, et al. Sex Differences in Colorectal Cancer: Epidemiology, Risk, Screening, and Molecular
          Mechanisms. 2025
        pmcid: PMC12347225
        evidence_status: source metadata incomplete
    evidence_status: source metadata incomplete
  - id: C4
    section: clinical_context
    status: active
    hypothesis: Inflammatory bowel disease and diverticular/inflammatory contexts may contribute.
    mechanism: Non-neoplastic colorectal specimens can differ by inflammatory diagnosis and site, creating non-tumor sex signal.
    features: Chronic colitis, diverticular disease, lymphoid aggregates, active inflammation.
    confounders: IBD, diverticulitis, site, age, medication.
    validation: Analyze neoplastic, inflammatory, and normal categories separately.
    literature:
      - short_citation: Wu et al., 2024
        citation: Wu Z, et al. Sex differences in colorectal cancer with a focus on the sex hormone-gut microbiome axis. 2024
        pmcid: PMC10921775
        evidence_status: source metadata incomplete
      - short_citation: Lattanzi et al., 2024
        citation: >-
          Lattanzi G, et al. Estrogen-related differences in antitumor immunity and gut microbiome contribute to sexual
          dimorphism of colorectal cancer. 2024
        evidence_status: source metadata incomplete
    evidence_status: source metadata incomplete
  - id: M1
    section: histomorphology
    status: active
    hypothesis: Sex hormone, immune, and microbiome biology may shape CRC morphology indirectly.
    mechanism: Hormone-gut microbiome-immune interactions can affect tumor microenvironment and pathway.
    features: TILs, stromal immune state, mucin, serrated architecture.
    confounders: Tumor site, MSI/MMR, age, microbiome/exposure, treatment.
    validation: Compare residual signal after site and molecular-pathway matching.
    literature:
      - short_citation: Wu et al., 2024
        citation: Wu Z, et al. Sex differences in colorectal cancer with a focus on the sex hormone-gut microbiome axis. 2024
        pmcid: PMC10921775
        evidence_status: source metadata incomplete
      - short_citation: Lattanzi et al., 2024
        citation: >-
          Lattanzi G, et al. Estrogen-related differences in antitumor immunity and gut microbiome contribute to sexual
          dimorphism of colorectal cancer. 2024
        evidence_status: source metadata incomplete
    evidence_status: source metadata incomplete
  - id: M2
    section: histomorphology
    status: active
    hypothesis: Large S3 drop suggests much sex signal is diagnosis/subsite/context mediated.
    mechanism: Diagnosis/context control removes a substantial part of the signal.
    features: Subsite, tumor morphology, adenoma/serrated lesions, inflammatory context.
    confounders: S3 cluster quality, diagnosis granularity, site labels.
    validation: Use Drop % leaderboard as disease-distribution investigation queue.
    literature:
      - short_citation: Abancens et al., 2020
        citation: >-
          Abancens M, Bustos V, Harvey H, McBryan J, Harvey BJ. Sexual Dimorphism in Colon Cancer. Frontiers in
          Oncology. 2020
        evidence_status: source metadata incomplete
      - short_citation: Tsokkou et al., 2025
        citation: >-
          Tsokkou S, et al. Sex Differences in Colorectal Cancer: Epidemiology, Risk, Screening, and Molecular
          Mechanisms. 2025
        pmcid: PMC12347225
        evidence_status: source metadata incomplete
    evidence_status: source metadata incomplete
  - id: M3
    section: histomorphology
    status: active
    hypothesis: Serrated/MSI-like morphology may be an H&E-visible sex-associated pathway.
    mechanism: Right-sided serrated/MSI-rich tumors can show mucin, lymphocytes, and distinctive precursor architecture.
    features: Serrated crypts, mucinous histology, TILs, lymphoid aggregates.
    confounders: Site, MSI/MMR, polyp subtype, age.
    validation: Match site and molecular/precursor pathway before interpreting residual sex signal.
    literature:
      - short_citation: Tsokkou et al., 2025
        citation: >-
          Tsokkou S, et al. Sex Differences in Colorectal Cancer: Epidemiology, Risk, Screening, and Molecular
          Mechanisms. 2025
        pmcid: PMC12347225
        evidence_status: source metadata incomplete
      - short_citation: Abancens et al., 2020
        citation: >-
          Abancens M, Bustos V, Harvey H, McBryan J, Harvey BJ. Sexual Dimorphism in Colon Cancer. Frontiers in
          Oncology. 2020
        evidence_status: source metadata incomplete
    evidence_status: source metadata incomplete
  - id: M4
    section: histomorphology
    status: active
    hypothesis: Benign mucosal sex morphology remains lower confidence.
    mechanism: >-
      Persistent signal in normal mucosa may reflect microbiome, inflammation, preparation, or site imbalance rather
      than direct sex biology.
    features: Lamina propria cellularity, lymphoid aggregates, mucosal architecture, goblet cells.
    confounders: Site, inflammation, prep, diagnosis, age.
    validation: Treat benign residual signal as exploratory and add DOI-backed reviewer references before prioritizing.
    literature:
      - short_citation: Wu et al., 2024
        citation: Wu Z, et al. Sex differences in colorectal cancer with a focus on the sex hormone-gut microbiome axis. 2024
        pmcid: PMC10921775
        evidence_status: source metadata incomplete
      - short_citation: Lattanzi et al., 2024
        citation: >-
          Lattanzi G, et al. Estrogen-related differences in antitumor immunity and gut microbiome contribute to sexual
          dimorphism of colorectal cancer. 2024
        evidence_status: source metadata incomplete
    evidence_status: source metadata incomplete
key_takeaways:
  - 'Best review target: subsite, serrated/MSI-like morphology, TILs, mucinous features.'
  - 'Main shortcut risk: subsite and disease distribution.'
  - This is a priority for disease-distribution explanation, not the strongest stable histology candidate.
