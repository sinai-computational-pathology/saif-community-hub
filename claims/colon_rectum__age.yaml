combo: colon_rectum__age
organ_slug: colon_rectum
organ: Colon/Rectum
demographic: age
demographic_label: Age
summary: >-
  Colon/rectum age signal is context-sensitive. The literature-supported mechanisms are age-dependent CRC/adenoma
  incidence, right-sided and serrated/sporadic pathways, early-onset CRC differences, hereditary context in younger
  patients, and age-related mucosal/molecular changes. Direct benign mucosal H&E aging signal is less certain.
claims:
  - id: C1
    section: clinical_context
    status: active
    hypothesis: Older patients are enriched for sporadic CRC, adenomas, and right-sided/serrated pathway lesions.
    mechanism: Age changes disease and precursor mix.
    features: Adenoma type, serrated lesions, CRC, right/left site, dysplasia.
    confounders: Diagnosis, subsite, procedure, screening, MSI/MMR.
    validation: Match diagnosis and subsite; test residual signal in benign mucosa.
    literature:
      - short_citation: Abancens et al., 2020
        citation: >-
          Abancens M, Bustos V, Harvey H, McBryan J, Harvey BJ. Sexual Dimorphism in Colon Cancer. Frontiers in
          Oncology. 2020
        evidence_status: source metadata incomplete
      - short_citation: Tsokkou et al., 2025
        citation: >-
          Tsokkou S, et al. Sex Differences in Colorectal Cancer: Epidemiology, Risk, Screening, and Molecular
          Mechanisms. 2025
        pmcid: PMC12347225
        evidence_status: source metadata incomplete
    evidence_status: source metadata incomplete
  - id: C2
    section: clinical_context
    status: active
    hypothesis: Younger patients may be enriched for early-onset/hereditary or inflammatory contexts.
    mechanism: Early-onset CRC, IBD, and hereditary pathways can shift morphology and immune context.
    features: Tumor grade, lymphocytes, mucin, IBD changes, adenoma burden.
    confounders: Age group, hereditary syndrome, IBD, subsite, stage.
    validation: Stratify early-onset versus older CRC and match site/stage.
    literature:
      - short_citation: Tsokkou et al., 2025
        citation: >-
          Tsokkou S, et al. Sex Differences in Colorectal Cancer: Epidemiology, Risk, Screening, and Molecular
          Mechanisms. 2025
        pmcid: PMC12347225
        evidence_status: source metadata incomplete
    evidence_status: source metadata incomplete
  - id: C3
    section: clinical_context
    status: active
    hypothesis: Screening and surveillance intensity can produce age-associated specimen mix.
    mechanism: >-
      Older cohorts may have more screening/surveillance polypectomies and cancer resections; younger cohorts more
      symptom/IBD workups.
    features: Normal biopsies, adenomas, serrated polyps, colectomy tissue, IBD surveillance biopsies.
    confounders: Screening status, procedure type, diagnosis, site.
    validation: Match screening/procedure categories and compare within benign polyp-only groups.
    literature:
      - short_citation: Tsokkou et al., 2025
        citation: >-
          Tsokkou S, et al. Sex Differences in Colorectal Cancer: Epidemiology, Risk, Screening, and Molecular
          Mechanisms. 2025
        pmcid: PMC12347225
        evidence_status: source metadata incomplete
      - short_citation: Abancens et al., 2020
        citation: >-
          Abancens M, Bustos V, Harvey H, McBryan J, Harvey BJ. Sexual Dimorphism in Colon Cancer. Frontiers in
          Oncology. 2020
        evidence_status: source metadata incomplete
    evidence_status: source metadata incomplete
  - id: C4
    section: clinical_context
    status: active
    hypothesis: Diverticular, ischemic, and chronic injury contexts may enrich older cases.
    mechanism: Non-neoplastic age-related colorectal diagnoses can add fibrosis, inflammation, and mucosal injury.
    features: Ischemic change, diverticular-associated colitis, fibrosis, ulceration, active inflammation.
    confounders: Diagnosis, site, vascular disease, procedure, inflammation.
    validation: Separate neoplastic, inflammatory, ischemic/diverticular, and normal categories.
    literature:
      - short_citation: Tsokkou et al., 2025
        citation: >-
          Tsokkou S, et al. Sex Differences in Colorectal Cancer: Epidemiology, Risk, Screening, and Molecular
          Mechanisms. 2025
        pmcid: PMC12347225
        evidence_status: source metadata incomplete
    evidence_status: source metadata incomplete
  - id: M1
    section: histomorphology
    status: active
    hypothesis: Age-linked molecular pathways may alter visible tumor morphology.
    mechanism: MSI, serrated, mucinous, and immune-rich tumors may vary with age and site.
    features: TILs, Crohn-like lymphoid reaction, mucin, serrated architecture.
    confounders: MSI/MMR, site, stage, grade, treatment.
    validation: Compare age signal after matching MSI/MMR and site.
    literature:
      - short_citation: Abancens et al., 2020
        citation: >-
          Abancens M, Bustos V, Harvey H, McBryan J, Harvey BJ. Sexual Dimorphism in Colon Cancer. Frontiers in
          Oncology. 2020
        evidence_status: source metadata incomplete
      - short_citation: Tsokkou et al., 2025
        citation: >-
          Tsokkou S, et al. Sex Differences in Colorectal Cancer: Epidemiology, Risk, Screening, and Molecular
          Mechanisms. 2025
        pmcid: PMC12347225
        evidence_status: source metadata incomplete
    evidence_status: source metadata incomplete
  - id: M2
    section: histomorphology
    status: active
    hypothesis: Benign mucosal age morphology is plausible but not strongly established.
    mechanism: >-
      Aging may affect immune tone, epithelial renewal, and stromal background, but routine H&E evidence needs
      strengthening.
    features: Lamina propria inflammation, lymphoid aggregates, mucosal architecture.
    confounders: Diagnosis, prep/biopsy site, inflammation, IBD.
    validation: Inspect normal/benign mucosa after excluding neoplasia and inflammatory disease.
    literature: []
    evidence_status: source metadata incomplete
  - id: M3
    section: histomorphology
    status: active
    hypothesis: Serrated and adenomatous precursor architecture may be a visible age carrier.
    mechanism: Age-related polyp burden changes the mix of tubular/villous adenomas and serrated lesions.
    features: Tubular/villous architecture, dysplasia, serrated crypts, mucin cap.
    confounders: Polyp type, site, screening, age, molecular markers.
    validation: Match polyp subtype and site before interpreting age signal.
    literature:
      - short_citation: Tsokkou et al., 2025
        citation: >-
          Tsokkou S, et al. Sex Differences in Colorectal Cancer: Epidemiology, Risk, Screening, and Molecular
          Mechanisms. 2025
        pmcid: PMC12347225
        evidence_status: source metadata incomplete
      - short_citation: Abancens et al., 2020
        citation: >-
          Abancens M, Bustos V, Harvey H, McBryan J, Harvey BJ. Sexual Dimorphism in Colon Cancer. Frontiers in
          Oncology. 2020
        evidence_status: source metadata incomplete
    evidence_status: source metadata incomplete
  - id: M4
    section: histomorphology
    status: active
    hypothesis: Stromal/inflammatory injury patterns may reflect non-neoplastic age context.
    mechanism: Ischemia, diverticular disease, and chronic injury can add fibrosis and inflammation.
    features: Fibrosis, muscularization, ulceration, active inflammation, vascular change.
    confounders: Diagnosis, site, vascular disease, IBD, diverticular disease.
    validation: Audit non-neoplastic older-case clusters for ischemic/diverticular labels.
    literature:
      - short_citation: Tsokkou et al., 2025
        citation: >-
          Tsokkou S, et al. Sex Differences in Colorectal Cancer: Epidemiology, Risk, Screening, and Molecular
          Mechanisms. 2025
        pmcid: PMC12347225
        evidence_status: source metadata incomplete
    evidence_status: source metadata incomplete
key_takeaways:
  - 'Best review target: site, serrated lesions, mucin, MSI-like lymphocytes, adenoma/CRC subtype.'
  - 'Main shortcut risk: age-skewed disease and subsite distribution.'
  - Needs stronger benign mucosal aging sources for intrinsic morphology claims.
