combo: uterus__age
organ_slug: uterus
organ: Uterus
demographic: age
demographic_label: Age
summary: >-
  Uterus age signal is a stable residual candidate. The main plausible carriers are menopausal/endometrial hormonal
  state, endometrial atrophy, gland density, stromal cellularity/fibrosis, cystic atrophy, and myometrial or
  leiomyoma-related sampling context. Current master evidence E40 is incomplete and should be replaced with modern
  pathology sources.
claims:
  - id: C1
    section: clinical_context
    status: active
    hypothesis: Biopsy and hysterectomy indications differ strongly by age.
    mechanism: >-
      Younger patients are enriched for proliferative/secretory endometrium and abnormal bleeding workups; older
      patients for postmenopausal bleeding, atrophy, hyperplasia, and carcinoma exclusion.
    features: Endometrial biopsy vs hysterectomy, hyperplasia/carcinoma, polyp, leiomyoma, atrophy.
    confounders: Procedure, diagnosis, menopausal status, hormone therapy, cancer history.
    validation: Match procedure and diagnosis; compare residual age signal in benign endometrium.
    literature: []
    evidence_status: source metadata incomplete
  - id: C2
    section: clinical_context
    status: active
    hypothesis: Menopause creates a strong clinical-context and morphology axis.
    mechanism: Postmenopausal status changes sampling indications and background endometrium.
    features: Atrophic endometrium, cystic atrophy, inactive glands, scant stroma.
    confounders: Menopausal status, hormone therapy, tamoxifen, bleeding indication.
    validation: Add menopausal/hormone-therapy metadata where possible.
    literature: []
    evidence_status: source metadata incomplete
  - id: C3
    section: clinical_context
    status: active
    hypothesis: Endometrial hyperplasia and carcinoma exclusion may enrich older cases.
    mechanism: Postmenopausal bleeding and obesity/tamoxifen contexts can increase hyperplasia/cancer workups.
    features: Hyperplasia, EIN/atypia, carcinoma, polyp, biopsy adequacy.
    confounders: Diagnosis, BMI, hormone therapy, tamoxifen, procedure type.
    validation: Exclude hyperplasia/cancer or match these labels before reviewing intrinsic age morphology.
    literature: []
    evidence_status: source metadata incomplete
  - id: C4
    section: clinical_context
    status: active
    hypothesis: Leiomyoma, polyp, and hysterectomy sampling can create age-associated tissue composition.
    mechanism: Procedure indication changes the amount of myometrium, leiomyoma, polyp, and background endometrium sampled.
    features: Leiomyoma hyalinization, endometrial polyp, myometrium, adenomyosis, hysterectomy blocks.
    confounders: Procedure, diagnosis, block site, menopausal status.
    validation: Match biopsy vs hysterectomy and benign lesion category.
    literature: []
    evidence_status: source metadata incomplete
  - id: M1
    section: histomorphology
    status: active
    hypothesis: Endometrial gland density and architecture encode age/hormonal state.
    mechanism: Cycling endometrium, inactive endometrium, and postmenopausal atrophy have distinct gland/stroma patterns.
    features: Gland density, gland size, cystic atrophy, gland:stroma ratio.
    confounders: Cycle phase, hormone therapy, hyperplasia, polyp, sampling adequacy.
    validation: Stratify by diagnosis/cycle/hormone state and quantify gland density.
    literature: []
    evidence_status: source metadata incomplete
  - id: M2
    section: histomorphology
    status: active
    hypothesis: Stromal cellularity and fibrosis may encode postmenopausal involution.
    mechanism: Endometrial and myometrial stromal compartments remodel with age and hormonal withdrawal.
    features: Stromal cellularity, fibrosis, vascular sclerosis, myometrial fibrosis.
    confounders: Leiomyoma, adenomyosis, prior procedure, inflammation.
    validation: Review benign background endometrium and myometrium separately.
    literature: []
    evidence_status: source metadata incomplete
  - id: M3
    section: histomorphology
    status: active
    hypothesis: Uterine age signal may persist even after diagnosis matching through tissue composition.
    mechanism: Menopause changes the amount and morphology of endometrium, myometrium, polyps, and leiomyomas sampled.
    features: Endometrial thickness, atrophy, myometrium, leiomyoma hyalinization.
    confounders: Procedure type, block sampling, diagnosis, hormone therapy.
    validation: Match hysterectomy vs biopsy and separately test endometrium-only regions.
    literature: []
    evidence_status: source metadata incomplete
  - id: M4
    section: histomorphology
    status: active
    hypothesis: Vascular and stromal sclerosis may be an age-associated background feature.
    mechanism: Aging and menopause can alter stromal vessels, myometrium, and endometrial support tissue.
    features: Thick-walled vessels, stromal fibrosis, myometrial sclerosis, hyalinized leiomyoma.
    confounders: Leiomyoma, hypertension, procedure, block site.
    validation: Quantify vascular/stromal features only after benign diagnosis and procedure matching.
    literature: []
    evidence_status: source metadata incomplete
key_takeaways:
  - 'Best review target: benign endometrial gland density, atrophy, cystic change, and stromal cellularity.'
  - 'Main shortcut risk: procedure type, postmenopausal bleeding workup, hyperplasia/carcinoma exclusion.'
  - 'Literature status: high-priority search gap because E40 metadata are incomplete.'
