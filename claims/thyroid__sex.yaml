combo: thyroid__sex
organ_slug: thyroid
organ: Thyroid
demographic: sex
demographic_label: Sex
summary: >-
  Sex signal in thyroid histology is likely mixed. Clinical-context signal is expected because thyroid nodules, thyroid
  cancer detection, Hashimoto thyroiditis, and autoimmune thyroid disease are more common in females. Morphology signal
  may persist through lymphocytic thyroiditis, germinal centers, Hurthle/oncocytic change, follicular destruction,
  fibrosis, Graves-like hyperplasia, and sex-biased thyroid aging biology, but much of this may remain
  diagnosis-mediated.
claims:
  - id: C1
    section: clinical_context
    status: active
    hypothesis: Female patients are enriched for thyroid nodule/cancer workup.
    mechanism: Higher thyroid nodule and cancer detection in females can create diagnosis/procedure shortcuts.
    features: Nodular hyperplasia, papillary carcinoma, follicular-pattern lesions, thyroidectomy/lobectomy.
    confounders: Nodule status, malignancy, subtype/stage, procedure, age.
    validation: Match nodule and cancer status; compare within benign and cancer-only subsets.
    literature:
      - short_citation: Meza & Chang, 2015
        citation: >-
          Meza R, Chang JT. Multistage carcinogenesis and the incidence of thyroid cancer in the US by sex, race, stage
          and histology. BMC Public Health. 2015
        doi: 10.1186/s12889-015-2108-4
        url: https://bmcpublichealth.biomedcentral.com/articles/10.1186/s12889-015-2108-4
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C2
    section: clinical_context
    status: active
    hypothesis: Female patients are enriched for Hashimoto thyroiditis/autoimmune thyroid disease.
    mechanism: Autoimmune thyroid disease is sex-skewed and strongly H&E-visible.
    features: Lymphocytic thyroiditis, germinal centers, Hurthle cells, follicular destruction, fibrosis.
    confounders: Thyroiditis diagnosis, age, nodule/cancer status.
    validation: Match thyroiditis status and inflammation severity; test attenuation.
    literature:
      - short_citation: Akamizu & Amino, 2017
        citation: Akamizu T, Amino N. Hashimoto's Thyroiditis. Endotext. Updated 2017
        url: https://www.ncbi.nlm.nih.gov/books/NBK285557/
        evidence_status: source metadata incomplete
      - short_citation: Le et al., 2024
        citation: >-
          Le Y, Geng C, Gao X, et al. The risk of thyroid cancer and sex differences in Hashimoto's thyroiditis, a
          meta-analysis. BMC Endocrine Disorders. 2024
        doi: 10.1186/s12902-024-01670-w
        url: https://bmcendocrdisord.biomedcentral.com/articles/10.1186/s12902-024-01670-w
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C3
    section: clinical_context
    status: active
    hypothesis: Graves disease/endocrine hyperfunction context may contribute.
    mechanism: Autoimmune endocrine disease can alter follicular architecture and colloid.
    features: Follicular hyperplasia, tall epithelium, scalloped colloid, vascularity.
    confounders: Graves diagnosis, treatment, thyroid function, age.
    validation: Stratify by Graves/hyperthyroid diagnosis if metadata exist.
    literature:
      - short_citation: Akamizu & Amino, 2017
        citation: Akamizu T, Amino N. Hashimoto's Thyroiditis. Endotext. Updated 2017
        url: https://www.ncbi.nlm.nih.gov/books/NBK285557/
        evidence_status: source metadata incomplete
    evidence_status: source metadata incomplete
  - id: C4
    section: clinical_context
    status: active
    hypothesis: Procedure type may differ by sex through nodule/autoimmune pathways.
    mechanism: Sex-skewed indications can alter lobectomy/thyroidectomy mix.
    features: Whole gland architecture, nodular specimens, biopsy/resection context.
    confounders: Procedure type, diagnosis, institution.
    validation: Procedure-matched analysis and institution controls.
    literature:
      - short_citation: Meza & Chang, 2015
        citation: >-
          Meza R, Chang JT. Multistage carcinogenesis and the incidence of thyroid cancer in the US by sex, race, stage
          and histology. BMC Public Health. 2015
        doi: 10.1186/s12889-015-2108-4
        url: https://bmcpublichealth.biomedcentral.com/articles/10.1186/s12889-015-2108-4
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: M1
    section: histomorphology
    status: active
    hypothesis: Lymphocytic thyroiditis morphology may be the strongest sex-visible carrier.
    mechanism: Female enrichment for autoimmune thyroiditis creates H&E-visible immune architecture.
    features: Lymphoid aggregates, germinal centers, plasma cells, follicular destruction.
    confounders: Thyroiditis status, age, diagnosis, treatment.
    validation: Compare sex prediction before/after matching or excluding thyroiditis.
    literature:
      - short_citation: Akamizu & Amino, 2017
        citation: Akamizu T, Amino N. Hashimoto's Thyroiditis. Endotext. Updated 2017
        url: https://www.ncbi.nlm.nih.gov/books/NBK285557/
        evidence_status: source metadata incomplete
      - short_citation: Le et al., 2024
        citation: >-
          Le Y, Geng C, Gao X, et al. The risk of thyroid cancer and sex differences in Hashimoto's thyroiditis, a
          meta-analysis. BMC Endocrine Disorders. 2024
        doi: 10.1186/s12902-024-01670-w
        url: https://bmcendocrdisord.biomedcentral.com/articles/10.1186/s12902-024-01670-w
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: M2
    section: histomorphology
    status: active
    hypothesis: Hurthle/oncocytic change may mediate sex signal through thyroiditis.
    mechanism: Chronic autoimmune injury produces oncocytic follicular epithelial change.
    features: Hurthle cells, eosinophilic granular cytoplasm, follicular destruction.
    confounders: Thyroiditis, nodules, neoplasia, age.
    validation: Quantify oncocytic change in thyroiditis-matched tissue.
    literature:
      - short_citation: Akamizu & Amino, 2017
        citation: Akamizu T, Amino N. Hashimoto's Thyroiditis. Endotext. Updated 2017
        url: https://www.ncbi.nlm.nih.gov/books/NBK285557/
        evidence_status: source metadata incomplete
    evidence_status: source metadata incomplete
  - id: M3
    section: histomorphology
    status: active
    hypothesis: Graves-like follicular hyperplasia may encode endocrine sex context.
    mechanism: Autoimmune hyperthyroid morphology can be sex-skewed.
    features: Tall crowded epithelium, scalloped colloid, hyperplastic follicles, vascularity.
    confounders: Graves diagnosis, treatment, thyroid function.
    validation: Test within and excluding Graves/hyperthyroid diagnoses.
    literature:
      - short_citation: Akamizu & Amino, 2017
        citation: Akamizu T, Amino N. Hashimoto's Thyroiditis. Endotext. Updated 2017
        url: https://www.ncbi.nlm.nih.gov/books/NBK285557/
        evidence_status: source metadata incomplete
    evidence_status: source metadata incomplete
  - id: M4
    section: histomorphology
    status: active
    hypothesis: Sex-biased thyroid aging/gene regulation may create subtle residual morphology.
    mechanism: Sex-specific molecular aging could affect follicular or immune compartments, though H&E linkage is indirect.
    features: Follicle size/colloid patterns, stromal fibrosis, immune infiltrate.
    confounders: Age, thyroiditis, nodules, cancer, treatment.
    validation: Age- and diagnosis-matched benign background analysis; interpret as indirect unless pathologist-confirmed.
    literature:
      - short_citation: Lopes-Ramos et al., 2024
        citation: Lopes-Ramos et al. Sex-biased thyroid aging / gene regulation. 2024
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12636590/
        evidence_status: source metadata incomplete
    evidence_status: source metadata incomplete
  - id: M5
    section: histomorphology
    status: active
    hypothesis: Direct sex morphology independent of thyroid diagnosis is uncertain.
    mechanism: Residual signal may reflect unmeasured autoimmune/nodule context rather than intrinsic sex morphology.
    features: Benign follicles and stroma after strict matching.
    confounders: Diagnosis, age, thyroiditis, nodule, procedure, institution.
    validation: Strict matched benign-background test with thyroiditis and nodule exclusions.
    literature:
      - short_citation: Meza & Chang, 2015
        citation: >-
          Meza R, Chang JT. Multistage carcinogenesis and the incidence of thyroid cancer in the US by sex, race, stage
          and histology. BMC Public Health. 2015
        doi: 10.1186/s12889-015-2108-4
        url: https://bmcpublichealth.biomedcentral.com/articles/10.1186/s12889-015-2108-4
        evidence_status: needs claim-level validation
      - short_citation: Akamizu & Amino, 2017
        citation: Akamizu T, Amino N. Hashimoto's Thyroiditis. Endotext. Updated 2017
        url: https://www.ncbi.nlm.nih.gov/books/NBK285557/
        evidence_status: source metadata incomplete
    evidence_status: needs claim-level validation
key_takeaways:
  - >-
    The strongest clinical-context hypotheses are female enrichment for nodules/cancer workup, Hashimoto thyroiditis,
    Graves/endocrine context, and procedure mix.
  - >-
    The strongest morphology hypotheses are lymphocytic thyroiditis, Hurthle change, Graves-like hyperplasia, and
    possibly subtle sex-biased thyroid aging.
  - >-
    The most important validation is matching by thyroiditis/Graves status, nodule status, malignancy/subtype/stage,
    age, procedure type, and institution.
