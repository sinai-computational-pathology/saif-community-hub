combo: esophagus__age
organ_slug: esophagus
organ: Esophagus
demographic: age
demographic_label: Age
summary: >-
  Age signal in esophageal histology is likely a mixture of clinical-context shortcuts and cumulative mucosal injury.
  Older patients are more likely to have Barrett esophagus, dysplasia, adenocarcinoma, and chronic reflux-related
  sampling, while younger patients may be relatively enriched for eosinophilic esophagitis or uncomplicated reflux
  biopsies. A residual signal after diagnosis balancing should be interpreted as chronic injury/metaplasia/remodeling
  until benign, non-Barrett squamous mucosa is reviewed separately.
claims:
  - id: C1
    section: clinical_context
    status: active
    hypothesis: Older patients may be enriched for Barrett esophagus and Barrett surveillance biopsies.
    mechanism: >-
      Barrett prevalence is associated with older age and GERD-related risk factors, increasing intestinal metaplasia
      and surveillance sampling in older cohorts.
    features: Columnar mucosa, goblet cells, intestinal metaplasia, GE-junction biopsies, multi-level surveillance jars.
    confounders: Barrett status, GERD, biopsy site, surveillance vs diagnostic biopsy, sex, smoking.
    validation: Compare age prediction after excluding Barrett biopsies, then within Barrett-only and non-Barrett-only strata.
    literature:
      - short_citation: van Blankenstein et al., 2005
        citation: >-
          van Blankenstein M, Looman CWN, Johnston BJ, Caygill CPJ. Age and sex distribution of the prevalence of
          Barrett's esophagus found in a primary referral endoscopy center. American Journal of Gastroenterology. 2005
        pmid: '15743353'
        url: https://pubmed.ncbi.nlm.nih.gov/15743353/
        evidence_status: needs claim-level validation
      - short_citation: Ward et al., 2006
        citation: >-
          Ward EM, Wolfsen HC, Achem SR, et al. Barrett's esophagus is common in older men and women undergoing
          screening colonoscopy regardless of reflux symptoms. American Journal of Gastroenterology. 2006
        pmid: '16405528'
        url: https://pubmed.ncbi.nlm.nih.gov/16405528/
        evidence_status: needs claim-level validation
      - short_citation: Sharma, 2022
        citation: 'Sharma P. Barrett Esophagus: A Review. JAMA. 2022;328(7):663-671'
        doi: 10.1001/jama.2022.13298
        url: https://jamanetwork.com/journals/jama/article-abstract/2795263
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C2
    section: clinical_context
    status: active
    hypothesis: Older patients may be enriched for dysplasia and carcinoma pathways.
    mechanism: >-
      Barrett-associated dysplasia/adenocarcinoma and esophageal carcinoma workups increase visible neoplasia and
      procedure differences.
    features: Low/high-grade dysplasia, adenocarcinoma, squamous cell carcinoma, necrosis, invasion, EMR/resection tissue.
    confounders: Diagnosis, tumor histology, stage, procedure type, prior treatment.
    validation: Exclude carcinoma/dysplasia or match dysplasia/tumor category before interpreting residual age signal.
    literature:
      - short_citation: Sharma, 2022
        citation: 'Sharma P. Barrett Esophagus: A Review. JAMA. 2022;328(7):663-671'
        doi: 10.1001/jama.2022.13298
        url: https://jamanetwork.com/journals/jama/article-abstract/2795263
        evidence_status: needs claim-level validation
      - short_citation: Odze, 2009
        citation: >-
          Odze RD. Barrett esophagus: histology and pathology for the clinician. Nature Reviews Gastroenterology &
          Hepatology. 2009;6(8):478-490
        pmid: '19581906'
        doi: 10.1038/nrgastro.2009.103
        url: https://pubmed.ncbi.nlm.nih.gov/19581906/
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C3
    section: clinical_context
    status: active
    hypothesis: Younger patients may be enriched for eosinophilic esophagitis or inflammatory symptom workups.
    mechanism: Age-skewed workup pathways can separate eosinophil-rich squamous biopsies from Barrett/cancer pathways.
    features: >-
      Eosinophil density, eosinophilic microabscesses, basal-zone hyperplasia, papillary elongation, lamina propria
      fibrosis.
    confounders: EoE diagnosis, atopy, reflux diagnosis, steroid/PPI treatment, biopsy level.
    validation: Stratify reflux/EoE/Barrett categories and test whether age signal follows diagnostic mix.
    literature:
      - short_citation: Mastracci et al., 2020
        citation: >-
          Mastracci L, Grillo F, Parente P, et al. Gastro-esophageal reflux disease and Barrett's esophagus: an overview
          with a histologic diagnostic approach. Pathologica. 2020
        doi: 10.32074/1591-951X-162
        url: https://old.pathologica.it/article/view/162
        evidence_status: needs claim-level validation
      - short_citation: Odze, 2009
        citation: >-
          Odze RD. Barrett esophagus: histology and pathology for the clinician. Nature Reviews Gastroenterology &
          Hepatology. 2009;6(8):478-490
        pmid: '19581906'
        doi: 10.1038/nrgastro.2009.103
        url: https://pubmed.ncbi.nlm.nih.gov/19581906/
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C4
    section: clinical_context
    status: active
    hypothesis: Procedure and anatomic sampling pattern may encode age.
    mechanism: >-
      Older cohorts may have more GE-junction, Barrett surveillance, EMR, and tumor resections; younger cohorts may have
      limited mucosal biopsies.
    features: Biopsy vs EMR/resection, GEJ vs mid/proximal esophagus, number of tissue fragments, ulcer/treatment effect.
    confounders: Procedure type, anatomic level, indication, institution.
    validation: Match specimen type and esophageal level; audit whether model attention localizes to sampling context.
    literature:
      - short_citation: Bellizzi & Odze, 2010
        citation: >-
          Bellizzi AM, Odze RD. Histopathology of Barrett's esophagus: A review for the practicing gastroenterologist.
          Techniques in Gastrointestinal Endoscopy. 2010;12(2):69-81
        doi: 10.1016/j.tgie.2010.02.008
        evidence_status: needs claim-level validation
      - short_citation: Sharma, 2022
        citation: 'Sharma P. Barrett Esophagus: A Review. JAMA. 2022;328(7):663-671'
        doi: 10.1001/jama.2022.13298
        url: https://jamanetwork.com/journals/jama/article-abstract/2795263
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: M1
    section: histomorphology
    status: active
    hypothesis: Cumulative reflux injury may encode age in squamous mucosa.
    mechanism: >-
      Longer cumulative exposure to reflux and injury can produce basal-zone hyperplasia, papillary elongation,
      inflammation, and erosive change.
    features: Basal-zone thickness, papillary elongation, spongiosis, neutrophils/eosinophils, erosions.
    confounders: GERD diagnosis, PPI use, EoE, infection, biopsy level.
    validation: Restrict to non-Barrett squamous biopsies and score reflux-pattern injury by age.
    literature:
      - short_citation: Mastracci et al., 2020
        citation: >-
          Mastracci L, Grillo F, Parente P, et al. Gastro-esophageal reflux disease and Barrett's esophagus: an overview
          with a histologic diagnostic approach. Pathologica. 2020
        doi: 10.32074/1591-951X-162
        url: https://old.pathologica.it/article/view/162
        evidence_status: needs claim-level validation
      - short_citation: Odze, 2009
        citation: >-
          Odze RD. Barrett esophagus: histology and pathology for the clinician. Nature Reviews Gastroenterology &
          Hepatology. 2009;6(8):478-490
        pmid: '19581906'
        doi: 10.1038/nrgastro.2009.103
        url: https://pubmed.ncbi.nlm.nih.gov/19581906/
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: M2
    section: histomorphology
    status: active
    hypothesis: Barrett metaplasia creates a strong age-associated morphology.
    mechanism: Replacement of squamous mucosa by columnar epithelium with goblet cells is directly visible on H&E.
    features: Goblet cells, columnar mucosa, cardia-type mucosa, dysplasia, glandular architecture.
    confounders: Barrett diagnosis, GEJ biopsy, surveillance status, sex.
    validation: Run a Barrett-excluded analysis and a Barrett-only residual age analysis.
    literature:
      - short_citation: Sharma, 2022
        citation: 'Sharma P. Barrett Esophagus: A Review. JAMA. 2022;328(7):663-671'
        doi: 10.1001/jama.2022.13298
        url: https://jamanetwork.com/journals/jama/article-abstract/2795263
        evidence_status: needs claim-level validation
      - short_citation: Bellizzi & Odze, 2010
        citation: >-
          Bellizzi AM, Odze RD. Histopathology of Barrett's esophagus: A review for the practicing gastroenterologist.
          Techniques in Gastrointestinal Endoscopy. 2010;12(2):69-81
        doi: 10.1016/j.tgie.2010.02.008
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: M3
    section: histomorphology
    status: active
    hypothesis: Chronic injury may remodel lamina propria and stromal architecture.
    mechanism: Reflux/EoE/chronic inflammation can produce fibrosis, vascularity, and reactive epithelial change.
    features: Lamina propria fibrosis, vascular congestion, ulcer bed, reactive epithelial atypia.
    confounders: Ulceration, EoE, reflux severity, procedure depth, treatment.
    validation: Quantify stromal fibrosis and reactive change within diagnosis-matched squamous mucosa.
    literature:
      - short_citation: Mastracci et al., 2020
        citation: >-
          Mastracci L, Grillo F, Parente P, et al. Gastro-esophageal reflux disease and Barrett's esophagus: an overview
          with a histologic diagnostic approach. Pathologica. 2020
        doi: 10.32074/1591-951X-162
        url: https://old.pathologica.it/article/view/162
        evidence_status: needs claim-level validation
      - short_citation: Odze, 2009
        citation: >-
          Odze RD. Barrett esophagus: histology and pathology for the clinician. Nature Reviews Gastroenterology &
          Hepatology. 2009;6(8):478-490
        pmid: '19581906'
        doi: 10.1038/nrgastro.2009.103
        url: https://pubmed.ncbi.nlm.nih.gov/19581906/
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: M4
    section: histomorphology
    status: active
    hypothesis: Residual age signal in tumor slides may reflect histologic subtype or treatment context.
    mechanism: Age can shift the proportion of adenocarcinoma, squamous carcinoma, dysplasia, and post-treatment specimens.
    features: Tumor subtype, gland formation, keratinization, necrosis, treatment effect, desmoplasia.
    confounders: Tumor histology, stage, treatment status, sampling type.
    validation: Perform tumor-only analysis matched by subtype/stage and separate background mucosa from tumor regions.
    literature:
      - short_citation: Sharma, 2022
        citation: 'Sharma P. Barrett Esophagus: A Review. JAMA. 2022;328(7):663-671'
        doi: 10.1001/jama.2022.13298
        url: https://jamanetwork.com/journals/jama/article-abstract/2795263
        evidence_status: needs claim-level validation
      - short_citation: Odze, 2009
        citation: >-
          Odze RD. Barrett esophagus: histology and pathology for the clinician. Nature Reviews Gastroenterology &
          Hepatology. 2009;6(8):478-490
        pmid: '19581906'
        doi: 10.1038/nrgastro.2009.103
        url: https://pubmed.ncbi.nlm.nih.gov/19581906/
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
key_takeaways:
  - The highest-risk shortcut is Barrett/GEJ surveillance and carcinoma/dysplasia case mix.
  - >-
    The most plausible residual tissue signal is cumulative squamous injury and stromal remodeling, but this must be
    tested after excluding Barrett and tumor cases.
  - Priority review should first label Barrett, dysplasia/cancer, EoE, reflux injury, and biopsy site.
