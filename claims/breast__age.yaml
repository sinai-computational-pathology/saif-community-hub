combo: breast__age
organ_slug: breast
organ: Breast
demographic: age
demographic_label: Age
summary: >-
  Breast age signal is a high-priority residual-signal candidate. The strongest literature-supported carrier is
  background terminal duct lobular unit (TDLU) involution with adipose replacement and stromal remodeling.
  Clinical-context signal may also arise from age-skewed screening, benign disease, cancer incidence, procedure type,
  and subtype mix.
claims:
  - id: C1
    section: clinical_context
    status: active
    hypothesis: Older breast specimens are enriched for cancer, screening-related lesions, and different procedure types.
    mechanism: >-
      Age changes the mix of benign biopsies, cancer resections, DCIS/invasive carcinoma, and screening-detected
      lesions.
    features: Benign vs malignant tissue, DCIS/invasive carcinoma, biopsy vs resection, tumor subtype.
    confounders: Diagnosis, DCIS/invasive status, procedure type, screening indication, treatment status.
    validation: Compare age prediction within benign-only and cancer-only subsets; match procedure type.
    literature:
      - short_citation: Radisky et al., 2016
        citation: >-
          Radisky DC, Visscher DW, Frank RD, et al. Natural history of age-related lobular involution and impact on
          breast cancer risk. Breast Cancer Research and Treatment. 2016
        pmid: '26846985'
        pmcid: PMC4764623
        doi: 10.1007/s10549-015-3665-5
        evidence_status: needs claim-level validation
      - short_citation: Ginsburg et al., 2008
        citation: >-
          Ginsburg OM, Martin LJ, Boyd NF. Mammographic density, lobular involution, and risk of breast cancer. British
          Journal of Cancer. 2008
        pmcid: PMC2579686
        doi: 10.1038/sj.bjc.6604635
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C2
    section: clinical_context
    status: active
    hypothesis: Breast cancer risk context can be encoded through tissue composition.
    mechanism: Mammographic density and lobular involution are breast-cancer-risk markers linked to fibroglandular composition.
    features: Fibroglandular density, epithelial/stromal fraction, adipose replacement, lobular involution.
    confounders: Density, benign disease indication, menopausal status, sampling site.
    validation: Test whether attention localizes to background fibroglandular tissue after diagnosis matching.
    literature:
      - short_citation: Ginsburg et al., 2008
        citation: >-
          Ginsburg OM, Martin LJ, Boyd NF. Mammographic density, lobular involution, and risk of breast cancer. British
          Journal of Cancer. 2008
        pmcid: PMC2579686
        doi: 10.1038/sj.bjc.6604635
        evidence_status: needs claim-level validation
      - short_citation: Walker & Martin, 2007
        citation: Walker RA, Martin CV. The aged breast. Journal of Pathology. 2007
        doi: 10.1002/path.2079
        evidence_status: needs claim-level validation
    evidence_status: needs claim-level validation
  - id: C3
    section: clinical_context
    status: active
    hypothesis: Menopausal status may create an age-associated sampling and morphology axis.
    mechanism: Menopause changes breast density, epithelial activity, lobular involution, and the clinical indication mix.
    features: Postmenopausal involution, adipose replacement, stromal density, benign proliferative disease.
    confounders: Menopausal status, hormone therapy, BMI, parity, biopsy indication.
    validation: If metadata allow, stratify premenopausal vs postmenopausal cases before age prediction review.
    literature:
      - short_citation: Walker & Martin, 2007
        citation: Walker RA, Martin CV. The aged breast. Journal of Pathology. 2007
        doi: 10.1002/path.2079
