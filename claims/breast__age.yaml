    evidence_status: needs claim-level validation
  - id: M2
    section: histomorphology
    status: active
    hypothesis: Adipose replacement and stromal remodeling encode breast aging.
    mechanism: Lobular regression shifts tissue composition from epithelial/stromal units toward fat and altered stroma.
    features: Adipose fraction, stromal density, duct/lobule ratio, collagen texture.
    confounders: Sampling site, obesity, specimen type, fixation, tumor desmoplasia.
    validation: Review attention maps for background adipose/stromal compartments outside tumor.
    literature:
