  - id: C4
    section: clinical_context
    status: active
    hypothesis: Benign high-risk lesions and DCIS may differ by age and screening intensity.
    mechanism: Screening and age-dependent risk can shift the fraction of atypia, DCIS, and excisional biopsies.
    features: Atypical ductal/lobular hyperplasia, DCIS, calcification-associated biopsies, excision scars.
    confounders: Screening status, procedure type, lesion diagnosis, calcifications, prior biopsy.
    validation: Match benign/high-risk/DCIS/invasive categories and review whether age signal follows lesion mix.
    literature:
