    evidence_status: needs claim-level validation
  - id: M4
    section: histomorphology
    status: active
    hypothesis: Mammographic-density correlates may map to H&E tissue composition.
    mechanism: Dense breast tissue reflects higher epithelial/fibrous content relative to fat and can change with age.
    features: Fibroglandular fraction, collagen-rich stroma, adipose fraction, epithelial area.
    confounders: BMI, menopause, parity, site, tumor adjacency.
    validation: Compare model attention with manual fibroglandular/adipose estimates in benign background.
    literature:
