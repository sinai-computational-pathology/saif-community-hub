    evidence_status: needs claim-level validation
  - id: M3
    section: histomorphology
    status: active
    hypothesis: Reproductive-timing biology may modulate normal breast involution.
    mechanism: Genetic/life-course factors linked to menarche and menopause can relate to TDLU involution measures.
    features: TDLU involution score, epithelial area, acinar count.
    confounders: Age, menopausal status, ancestry, benign disease cohort composition.
    validation: Interpret residual age signal as life-course morphology only after direct tissue review.
    literature:
