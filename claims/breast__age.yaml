  - id: M1
    section: histomorphology
    status: active
    hypothesis: TDLU involution increases with age and can remain visible after diagnosis matching.
    mechanism: Aging and reproductive/hormonal history reduce lobular epithelial and acinar compartments.
    features: TDLU density, lobular size, acinar number, epithelial cellularity.
    confounders: Menopausal status, parity/reproductive history, benign disease, tumor-adjacent tissue.
    validation: Quantify TDLU involution in benign/background tissue matched by diagnosis and procedure.
    literature:
      - short_citation: Radisky et al., 2016
        citation: >-
