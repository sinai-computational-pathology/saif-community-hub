key_takeaways:
  - 'Best histology-review target: benign/background TDLU involution, adipose replacement, and stromal density.'
  - 'Main shortcut risk: cancer/benign mix, screening context, and biopsy versus resection.'
  - 'Priority Score rationale: high residual S3_CC performance with strong specimen availability and low Drop %.'
