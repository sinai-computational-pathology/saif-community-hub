    status: active
    hypothesis: Older patients may be enriched for dysplasia and gastric adenocarcinoma workups.
    mechanism: Atrophy-metaplasia-dysplasia-carcinoma pathways and surveillance increase neoplastic samples in older patients.
    features: Dysplasia, adenocarcinoma, intestinal vs diffuse type, ulceration, desmoplasia, resection tissue.
    confounders: Cancer status, dysplasia grade, H. pylori, treatment, procedure type.
    validation: Exclude dysplasia/cancer or match neoplastic category before reviewing intrinsic age morphology.
