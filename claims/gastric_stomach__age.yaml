  - id: C4
    section: clinical_context
    status: active
    hypothesis: H. pylori and post-eradication status may mediate age signal.
    mechanism: Age correlates with cumulative infection duration and incomplete reversal of atrophy/metaplasia.
    features: Active chronic gastritis, lymphoid aggregates, organisms, atrophy, intestinal metaplasia.
    confounders: H. pylori status, eradication history, geography, PPI/antibiotic exposure.
    validation: Stratify by H. pylori status and atrophy/metaplasia stage.
    literature:
