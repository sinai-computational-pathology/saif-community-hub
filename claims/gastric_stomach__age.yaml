key_takeaways:
  - Gastric age is one of the better-supported non-ENT top-20 hypotheses.
  - The strongest features are atrophy, intestinal metaplasia, chronic gastritis, and site/procedure context.
  - The most important validation is H. pylori/autoimmune status, biopsy site, and neoplasia exclusion or matching.
