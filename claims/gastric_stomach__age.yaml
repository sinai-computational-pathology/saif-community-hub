  - id: M5
    section: histomorphology
    status: active
    hypothesis: Endocrine-cell and autoimmune-gastritis context may create an older-age shortcut.
    mechanism: Autoimmune/oxyntic atrophy and hypergastrinemia can alter endocrine-cell patterns and corpus mucosa.
    features: Corpus atrophy, ECL-cell change if stained, intestinal/pseudopyloric metaplasia, neuroendocrine lesions.
    confounders: Autoimmune gastritis, corpus site, pernicious anemia, stains unavailable on H&E.
    validation: Identify corpus-predominant atrophy and autoimmune gastritis diagnoses; review separately.
