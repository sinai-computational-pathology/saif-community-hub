combo: gastric_stomach__age
organ_slug: gastric_stomach
organ: Gastric / Stomach
demographic: age
demographic_label: Age
summary: >-
  Age signal in gastric histology has strong literature support but remains highly confounded by Helicobacter pylori,
  autoimmune gastritis, medication exposure, and cumulative injury. Older patients are enriched for chronic gastritis,
  atrophic gastritis, intestinal metaplasia, dysplasia, and gastric cancer workups. Residual age signal after S3 control
  may still persist in background mucosa through gland loss, metaplasia, chronic inflammation, endocrine-cell change,
  and stromal remodeling.
claims:
  - id: C1
    section: clinical_context
    status: active
    hypothesis: Older patients may be enriched for chronic atrophic gastritis and intestinal metaplasia.
    mechanism: Decades of H. pylori, autoimmune, chemical, or cumulative injury increase gland loss and metaplastic change.
    features: Oxyntic/antral atrophy, intestinal metaplasia, chronic gastritis, gland loss.
    confounders: H. pylori, autoimmune gastritis, biopsy site, PPI use, ethnicity/geography.
    validation: Match atrophy/metaplasia diagnosis and gastric site; retest residual age signal in non-atrophic mucosa.
    literature:
      - short_citation: Vara-Luiz et al., 2025
        citation: >-
          Vara-Luiz F, et al. Clinical, Endoscopic and Histologic Differences in Gastric Mucosa Between Younger and
          Older Adults: An Observational Study on the Aging Stomach. Medical Sciences. 2025
