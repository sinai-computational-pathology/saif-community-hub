  - id: M3
    section: histomorphology
    status: active
    hypothesis: Chronic inflammatory background may encode cumulative gastric injury.
    mechanism: Persistent gastritis produces lymphoplasmacytic inflammation, lymphoid aggregates, and reactive epithelial change.
    features: Chronic inflammation, activity, lymphoid aggregates, foveolar hyperplasia, erosions.
    confounders: H. pylori, NSAIDs, bile reflux, autoimmune gastritis, PPI use.
    validation: Score Sydney-system features and test age prediction after adjusting for inflammation.
    literature:
