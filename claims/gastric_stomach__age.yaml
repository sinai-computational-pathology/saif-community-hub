  - id: C3
    section: clinical_context
    status: active
    hypothesis: Biopsy site and endoscopy indication can encode age.
    mechanism: Older patients may undergo more extensive mapping biopsies, ulcer follow-up, or metaplasia surveillance.
    features: Antrum vs corpus, incisura, mapping fragments, polyp/ulcer biopsies, normal vs abnormal mucosa.
    confounders: Site, indication, number of fragments, institution, endoscopist pattern.
    validation: Add site/procedure matching and analyze antrum-only/corpus-only subsets.
