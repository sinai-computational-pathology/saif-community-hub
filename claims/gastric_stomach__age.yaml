  - id: M4
    section: histomorphology
    status: active
    hypothesis: Stromal/smooth-muscle proliferative atrophy may contribute to residual morphology.
    mechanism: Atrophic lesions can include smooth-muscle fiber proliferation and remodeling of lamina propria.
    features: Smooth muscle fibers in lamina propria, fibrosis, gland distortion, stromal texture.
    confounders: Atrophy stage, site, chronic injury, orientation.
    validation: Review atrophy-stage patterns in age-matched and H. pylori-matched samples.
