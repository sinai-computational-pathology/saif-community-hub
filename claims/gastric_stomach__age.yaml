  - id: M1
    section: histomorphology
    status: active
    hypothesis: Gastric gland loss and mucosal atrophy encode age.
    mechanism: Chronic injury and aging-associated mucosal change reduce gland density and alter mucosal architecture.
    features: Gland density, mucosal thickness, oxyntic gland loss, pseudopyloric/metaplastic glands.
    confounders: H. pylori, autoimmune gastritis, site, biopsy orientation.
    validation: Quantify gland density within site-matched non-neoplastic biopsies.
    literature:
