  - id: M2
    section: histomorphology
    status: active
    hypothesis: Intestinal metaplasia creates a strong visible age-associated feature.
    mechanism: Metaplastic goblet/intestinal epithelium accumulates with chronic injury and older age.
    features: Goblet cells, intestinal-type epithelium, complete/incomplete metaplasia, Paneth cells.
    confounders: H. pylori, autoimmune gastritis, site, ethnicity/geography.
    validation: Separate metaplasia-positive and metaplasia-negative cohorts; quantify residual signal.
    literature:
