  - id: M3
    section: histomorphology
    status: active
    hypothesis: Minor salivary gland autoimmune/sicca morphology may carry indirect sex signal.
    mechanism: >-
      Female-skewed Sjogren/sicca workups can introduce labial salivary gland biopsies with lymphocytic sialadenitis and
      atrophy/fibrosis.
    features: Lymphocytic foci, focus score, acinar atrophy, duct ectasia, periductal fibrosis, fatty replacement.
    confounders: Sjogren/sicca diagnosis, salivary gland sampling, age, medications, radiation.
    validation: >-
      Separate salivary-containing slides; match Sjogren/sicca diagnosis; test benign oral mucosa without glands
      independently.
