    status: active
    hypothesis: Sex signal may reflect tobacco/alcohol or betel-associated field change.
    mechanism: Exposure patterns can alter keratinizing dysplasia/SCC, chronic mucosal injury, and field cancerization.
    features: Hyperkeratosis, keratinizing dysplasia/SCC, field change, chronic inflammation, ulceration, candidiasis.
    confounders: Smoking, alcohol, betel nut, diagnosis, subsite, age, institution.
    validation: Use exposure metadata if available; otherwise match keratinizing lesion subtype, dysplasia grade, and subsite.
