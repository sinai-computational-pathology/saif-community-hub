organ_slug: mouth_oral_cavity
organ: Mouth / Oral Cavity
demographic: sex
demographic_label: Sex
summary: >-
  Sex signal in oral cavity histology is expected to be dominated by clinical-context and exposure differences, with
  some direct disease-pattern support for specific oral mucosal diagnoses. Male patients are generally overrepresented
  in head-and-neck/oral cavity cancer cohorts and may differ in tobacco, alcohol, betel nut, subsite, stage, and
  procedure context. Female patients may be enriched for oral lichen planus/lichenoid inflammatory disease and
  Sjogren-related minor salivary gland biopsy context. Direct normal oral epithelial sex morphology is weakly
  established; any residual benign-mucosa signal should be interpreted cautiously.
claims:
  - id: C1
    section: clinical_context
    status: active
    hypothesis: Male patients are enriched for oral/head-and-neck cancer specimens.
    mechanism: >-
      Higher male head-and-neck cancer prevalence can create diagnosis and specimen-type shortcuts in mixed oral
      pathology cohorts.
    features: SCC vs benign mucosa, dysplasia, invasive carcinoma, resection vs biopsy, necrosis, perineural invasion.
    confounders: Diagnosis, stage, subsite, procedure type, age, institution.
    validation: >-
      Match benign/malignant status and SCC stage/subsite; test residual sex signal within SCC-only and benign-only
      subsets.
    literature:
      - short_citation: Park et al., 2022
        citation: >-
          Park JO, Nam IC, Kim CS, et al. Sex Differences in the Prevalence of Head and Neck Cancers: A 10-Year
          Follow-Up Study of 10 Million Healthy People. Cancers. 2022
        pmid: '35626129'
        pmcid: PMC9139445
        doi: 10.3390/cancers14102521
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9139445/
        evidence_status: needs claim-level validation
