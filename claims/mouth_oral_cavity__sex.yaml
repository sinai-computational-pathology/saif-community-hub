  - id: C4
    section: clinical_context
    status: active
    hypothesis: Female enrichment for oral lichen planus/lichenoid disease may create inflammatory morphology signal.
    mechanism: >-
      Oral lichen planus and lichenoid mucositis often show female predominance and have characteristic H&E interface
      inflammation.
    features: >-
      Band-like lymphocytic infiltrate, basal-cell degeneration, Civatte bodies, saw-tooth rete, hyperkeratosis,
      ulceration.
    confounders: Diagnosis, medication/contact reaction, site, age, biopsy indication.
    validation: >-
      Stratify or exclude OLP/lichenoid mucositis; test whether sex signal attenuates after matching lichenoid
      diagnoses.
