key_takeaways:
  - >-
    The strongest sex hypotheses are clinical-context signals: male enrichment for cancer, exposure-linked
    dysplasia/SCC, subsite/stage/procedure differences, female-enriched lichenoid disease, and female-enriched
    Sjogren/sicca minor salivary gland workups.
  - >-
    Unlike race, sex has some diagnosis-specific H&E morphology carriers with clearer literature support, especially
    OLP/lichenoid interface mucositis and minor salivary gland biopsy context. These remain mediated by diagnosis mix
    rather than normal-mucosa sex dimorphism.
  - >-
    The most important validation is matching by diagnosis, subsite, stage/grade, exposure proxy, procedure type,
    treatment status, lichenoid/OLP diagnosis, and salivary gland/Sjogren context.
