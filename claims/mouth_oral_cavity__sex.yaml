  - id: M5
    section: histomorphology
    status: active
    hypothesis: Direct benign oral epithelial sex morphology is not well established.
    mechanism: >-
      Sex hormones and immune dimorphism may have subtle mucosal effects, but current H&E support is much weaker than
      disease-context support.
    features: Epithelial thickness, keratinization, lamina propria collagen, vascularity, basal/parabasal cellularity.
    confounders: Subsite, age, inflammation, diagnosis, salivary tissue, exposure.
    validation: >-
      Test benign non-inflamed, subsite-matched mucosa only; require independent cohort replication before biological
      interpretation.
