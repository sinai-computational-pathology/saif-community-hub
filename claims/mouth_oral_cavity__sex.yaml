  - id: C5
    section: clinical_context
    status: active
    hypothesis: Female enrichment for Sjogren/xerostomia-related workups may create minor salivary gland signal.
    mechanism: Sjogren disease and sicca symptoms are female-skewed and often evaluated with labial/minor salivary gland biopsy.
    features: >-
      Minor salivary gland tissue, lymphocytic foci/focus score, acinar atrophy, duct dilation, fibrosis, fatty
      replacement.
    confounders: Salivary gland inclusion, Sjogren diagnosis, autoimmune disease, medication/radiation history, biopsy site.
    validation: Analyze slides with minor salivary gland tissue separately; match or exclude Sjogren/sicca workups.
    literature:
