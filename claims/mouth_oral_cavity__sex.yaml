    mechanism: Exposure-linked and subsite-linked SCC can differ in keratinization, grade, invasion, and treatment pathway.
    features: Keratin pearls, tumor grade, basaloid/non-keratinizing pattern, necrosis, perineural invasion, desmoplasia.
    confounders: Tumor subtype, HPV/p16, smoking/alcohol/betel, subsite, stage, treatment status.
    validation: >-
      Restrict to SCC and match grade/subsite/stage/exposure; inspect whether attention localizes to tumor versus
      surrounding mucosa.
