  - id: C3
    section: clinical_context
    status: active
    hypothesis: Sex differences in oral cancer subsite, stage, and treatment pathway may create shortcuts.
    mechanism: Men and women may differ in tumor location, presentation, clinical management, and outcomes.
    features: >-
